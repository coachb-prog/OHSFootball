<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Red Devils Playbook</title>
<style>
:root {
  --red: #CC0000;
  --red-dark: #990000;
  --black: #111111;
  --black2: #1A1A1A;
  --black3: #242424;
  --white: #FFFFFF;
  --gold: #E8C96A;
  --gray: #8A8A8A;
  --border: #2A2A2A;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--black); }
body {
  color: var(--white);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
}

/* ===== APP SHELL ===== */
.app { display: flex; min-height: 100vh; flex-direction: column; }

.topbar {
  background: linear-gradient(180deg, #1A0000 0%, var(--black) 100%);
  border-bottom: 2px solid var(--red);
  padding: 14px 16px 10px;
  position: sticky; top: 0; z-index: 50;
}
.topbar-inner { display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand-name { line-height: 1.1; }
.brand-name b { display: block; font-size: 16px; font-weight: 900; letter-spacing: 1.5px; }
.brand-name span { display: block; font-size: 10px; letter-spacing: 2.5px; color: var(--gold); font-weight: 700; }
.search-box {
  display: flex; align-items: center; gap: 8px; background: var(--black2);
  border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px;
  margin-top: 10px;
}
.search-box input {
  background: transparent; border: none; outline: none; color: white;
  font-size: 14px; flex: 1; min-width: 0;
}
.search-box input::placeholder { color: var(--gray); }
.search-clear { color: var(--gray); cursor: pointer; font-size: 14px; padding: 2px 4px; display: none; }

.tabs-row {
  display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 0;
  background: var(--black); border-bottom: 1px solid var(--border);
  scrollbar-width: none; position: sticky; top: 0; z-index: 49;
}
.tabs-row::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0; padding: 10px 14px; background: transparent; border: none;
  color: var(--gray); font-size: 12.5px; font-weight: 800; letter-spacing: 0.5px;
  cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px;
  white-space: nowrap;
}
.tab-btn.active { color: var(--white); border-bottom-color: var(--gold); }

.main { flex: 1; padding: 16px; max-width: 720px; margin: 0 auto; width: 100%; }
.section { display: none; }
.section.active { display: block; }

.section-title {
  font-size: 12px; letter-spacing: 2px; color: var(--gold); font-weight: 800;
  margin: 4px 0 12px; text-transform: uppercase;
}

/* ===== POSITION FILTER (Assignments) ===== */
.chip-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.chip {
  padding: 8px 14px; border-radius: 99px; font-size: 12.5px; font-weight: 800;
  border: 1.5px solid var(--border); background: var(--black2); color: var(--gray);
  cursor: pointer; letter-spacing: 0.5px;
}
.chip.active { background: var(--red); color: white; border-color: var(--red); }

/* ===== CARDS ===== */
.card {
  background: var(--black2); border: 1px solid var(--border); border-radius: 14px;
  margin-bottom: 12px; overflow: hidden;
}
.card-header {
  padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer;
}
.card-header:active { background: var(--black3); }
.card-title { font-size: 15px; font-weight: 800; flex: 1; letter-spacing: 0.3px; }
.card-sub { font-size: 11.5px; color: var(--gray); margin-top: 2px; font-weight: 600; }
.card-tag {
  font-size: 10.5px; color: var(--gold); font-weight: 800; letter-spacing: 1px;
  background: rgba(232,201,106,0.1); border: 1px solid rgba(232,201,106,0.3);
  border-radius: 6px; padding: 3px 8px; flex-shrink: 0;
}
.card-chevron { color: var(--gray); font-size: 16px; transition: transform 0.2s; flex-shrink: 0; }
.card.open .card-chevron { transform: rotate(90deg); }
.card-body { display: none; padding: 0 16px 16px; }
.card.open .card-body { display: block; }
.front-btn {
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.5px; color: var(--gray);
  background: var(--black3); border: 1px solid rgba(232,201,106,0.25);
  border-radius: 6px; padding: 5px 10px; cursor: pointer;
}
.front-btn.active { color: #1a1a1a; background: var(--gold); border-color: var(--gold); }

/* ===== FORMATION DIAGRAM ===== */
.diagram-wrap {
  background: var(--black3); border-radius: 10px; overflow: hidden; margin-bottom: 12px;
}
.diagram-wrap svg { width: 100%; display: block; }

.formation-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px;
}
.formation-card { background: var(--black2); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.formation-name { font-size: 14px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 8px; }
.formation-desc { font-size: 12.5px; color: #ccc; line-height: 1.5; margin-top: 8px; }

/* ===== ROUTE LEGEND / TABLE ===== */
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #ddd; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.route-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
.route-table th {
  background: var(--black3); color: var(--gold); padding: 8px 10px; text-align: left;
  font-size: 10.5px; letter-spacing: 1px; font-weight: 800;
}
.route-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.route-table tr:last-child td { border-bottom: none; }
.route-table tr.dimmed td { opacity: 0.3; }
.route-table tr { cursor: pointer; }
.pos-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

.play-controls { display: flex; gap: 8px; margin-bottom: 12px; }
.play-controls button {
  flex: 1; padding: 11px; border-radius: 8px; font-size: 13px; font-weight: 800;
  cursor: pointer; letter-spacing: 0.5px; border: none;
}
.play-btn { background: var(--red); color: white; }
.reset-btn { background: var(--black3); color: var(--white); border: 1px solid var(--border) !important; }
.mover { transition: none; }

.qb-notes { background: var(--black3); border-radius: 10px; padding: 12px 14px; border-left: 3px solid var(--gold); }
.qb-notes-title { font-size: 10.5px; color: var(--gold); font-weight: 800; letter-spacing: 1.5px; margin-bottom: 8px; }
.qb-notes ul { padding-left: 16px; display: flex; flex-direction: column; gap: 5px; }
.qb-notes li { font-size: 12.5px; color: #ccc; line-height: 1.4; }

/* ===== COVERAGE ===== */
.cov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }
.cov-card {
  background: var(--black2); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px;
}
.cov-name { font-size: 15px; font-weight: 900; letter-spacing: 1px; }
.cov-meta { font-size: 11px; color: var(--gold); font-weight: 700; margin-top: 4px; }
.cov-detail { font-size: 12px; color: #ccc; margin-top: 6px; line-height: 1.4; }
.cov-detail b { color: var(--white); }

/* ===== MOTION ===== */
.motion-card { background: var(--black2); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.motion-name { font-size: 16px; font-weight: 900; letter-spacing: 1px; color: var(--gold); }
.motion-desc { font-size: 13px; color: #ddd; margin-top: 6px; line-height: 1.5; }

/* ===== ASSIGNMENTS ===== */
.assign-card { background: var(--black2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.assign-play { font-size: 12px; color: var(--gold); font-weight: 800; letter-spacing: 0.5px; margin-bottom: 6px; }
.assign-q { font-size: 13.5px; font-weight: 700; color: white; margin-bottom: 6px; line-height: 1.4; }
.assign-a { font-size: 13px; color: #ccc; line-height: 1.5; border-left: 2px solid var(--red); padding-left: 10px; }

.empty-state { text-align: center; color: var(--gray); padding: 40px 16px; font-size: 14px; }
mark { background: var(--gold); color: var(--black); border-radius: 3px; padding: 0 2px; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg width="36" height="36" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
          <circle cx="40" cy="40" r="36" fill="#CC0000" stroke="#E8C96A" stroke-width="3"/>
          <text x="40" y="48" text-anchor="middle" font-size="32" font-weight="900" fill="white" font-family="sans-serif">O</text>
          <line x1="40" y1="4" x2="40" y2="14" stroke="#E8C96A" stroke-width="3"/>
          <line x1="32" y1="6" x2="32" y2="14" stroke="#E8C96A" stroke-width="2.5"/>
          <line x1="48" y1="6" x2="48" y2="14" stroke="#E8C96A" stroke-width="2.5"/>
        </svg>
        <div class="brand-name"><b>OWENSBORO RED DEVILS</b><span>INTERACTIVE PLAYBOOK</span></div>
      </div>
    </div>
    <div class="search-box">
      <span style="color:var(--gray)">🔎</span>
      <input id="search-input" placeholder="Search plays, formations, coverages, motions…" oninput="onSearch()">
      <span class="search-clear" id="search-clear" onclick="clearSearch()">✕</span>
    </div>
  </div>

  <div class="tabs-row" id="tabs-row">
    <button class="tab-btn active" data-tab="formations" onclick="showTab('formations')">FORMATIONS</button>
    <button class="tab-btn" data-tab="passing" onclick="showTab('passing')">PASS GAME</button>
    <button class="tab-btn" data-tab="screens" onclick="showTab('screens')">SCREENS</button>
    <button class="tab-btn" data-tab="runs" onclick="showTab('runs')">RUN GAME</button>
    <button class="tab-btn" data-tab="olterms" onclick="showTab('olterms')">OL TERMS</button>
    <button class="tab-btn" data-tab="motions" onclick="showTab('motions')">MOTIONS</button>
    <button class="tab-btn" data-tab="coverages" onclick="showTab('coverages')">COVERAGES</button>
    <button class="tab-btn" data-tab="assignments" onclick="showTab('assignments')">ASSIGNMENTS</button>
  </div>

  <div class="main">
    <div class="section" id="section-formations">
      <div class="section-title">Formations</div>
      <div class="formation-grid" id="formations-list"></div>
    </div>

    <div class="section" id="section-passing">
      <div class="section-title">Pass Game Concepts</div>
      <div id="passing-list"></div>
    </div>

    <div class="section" id="section-screens">
      <div class="section-title">Screen Game</div>
      <div id="screens-list"></div>
    </div>

    <div class="section" id="section-runs">
      <div class="section-title">Run Game</div>
      <div id="runs-list"></div>
    </div>

    <div class="section" id="section-olterms">
      <div class="section-title">OL Terminology Manual</div>
      <div id="olterms-list"></div>
    </div>

    <div class="section" id="section-motions">
      <div class="section-title">Motions</div>
      <div id="motions-list"></div>
    </div>

    <div class="section" id="section-coverages">
      <div class="section-title">Defensive Coverages</div>
      <div class="cov-grid" id="coverages-list"></div>
    </div>

    <div class="section" id="section-assignments">
      <div class="section-title">Position Assignments</div>
      <div class="chip-row" id="position-chips">
        <button class="chip active" data-pos="QB" onclick="setAssignPos('QB',this)">QB</button>
        <button class="chip" data-pos="WR" onclick="setAssignPos('WR',this)">WR</button>
        <button class="chip" data-pos="RB" onclick="setAssignPos('RB',this)">RB</button>
        <button class="chip" data-pos="OL" onclick="setAssignPos('OL',this)">OL</button>
      </div>
      <div id="assignments-list"></div>
    </div>
  </div>
</div>

<script>
// ==================== SVG FIELD HELPERS ====================
const VW = 400, VH = 260, LOS = 162;
const OL_POS = [{x:140,l:'LT'},{x:167,l:'LG'},{x:194,l:'C'},{x:221,l:'RG'},{x:248,l:'RT'}];
const SLOT_OFF = 10;
const QX=194, QY=LOS+36, BX=218, BY=LOS+58;

function fieldSVG(players, label) {
  // Plain ruled field background, matching the team's real install-sheet diagrams:
  // light background, thin gray yard lines every 5 yards, ruler-style hash ticks
  // spanning the width of each line, and rotated yard-number labels every 10 yards.
  const bg = `<rect x="0" y="0" width="${VW}" height="${VH}" fill="#FAFAF7"/>`;
  let yLines = '', hashes = '', numbers = '';
  let yardCount = 0;
  for (let y = VH - 35; y >= 10; y -= 35) {
    yardCount += 5;
    yLines += `<line x1="0" y1="${y}" x2="${VW}" y2="${y}" stroke="#999" stroke-width="1" opacity="0.55"/>`;
    for (let x = 16; x <= VW - 16; x += 12)
      hashes += `<line x1="${x}" y1="${y - 3}" x2="${x}" y2="${y + 3}" stroke="#999" stroke-width="0.75" opacity="0.5"/>`;
    if (yardCount % 10 === 0) {
      const num = yardCount > 50 ? 100 - yardCount : yardCount;
      numbers += `<text x="10" y="${y+3}" font-size="7" fill="#888" font-family="sans-serif" font-weight="700" transform="rotate(-90 10 ${y+3})">${num}</text>`;
      numbers += `<text x="${VW-10}" y="${y+3}" text-anchor="end" font-size="7" fill="#888" font-family="sans-serif" font-weight="700" transform="rotate(-90 ${VW-10} ${y+3})">${num}</text>`;
    }
  }
  const sides = `<line x1="6" y1="0" x2="6" y2="${VH}" stroke="#999" stroke-width="1.5" opacity="0.6"/>
    <line x1="${VW-6}" y1="0" x2="${VW-6}" y2="${VH}" stroke="#999" stroke-width="1.5" opacity="0.6"/>`;
  const los = `<line x1="0" y1="${LOS}" x2="${VW}" y2="${LOS}" stroke="#CC0000" stroke-width="1.5" opacity="0.85"/>
    <text x="5" y="${LOS-4}" font-size="8" fill="#CC0000" opacity="0.8" font-family="sans-serif" font-weight="700">LOS</text>`;
  const lbl = label ? `<text x="${VW/2}" y="${VH-5}" text-anchor="middle" font-size="11" fill="#666" opacity="0.7" font-family="sans-serif" font-weight="800" letter-spacing="1">${label}</text>` : '';
  return `<svg viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  ${bg}${yLines}${hashes}${numbers}${sides}${los}${players}${lbl}</svg>`;
}
const OL_R = 10, WR_R = 9, QB_R = 10, RB_R = 9, TE_R = 10;
function olC(x,y,l) {
  if (l === 'C') {
    return `<rect x="${x-OL_R}" y="${y-OL_R}" width="${OL_R*2}" height="${OL_R*2}" fill="white" stroke="#333" stroke-width="2"/>`;
  }
  return `<circle cx="${x}" cy="${y}" r="${OL_R}" fill="white" stroke="#333" stroke-width="2"/>`;
}
function wrC(x,y,l) {
  return `<circle cx="${x}" cy="${y}" r="${WR_R}" fill="white" stroke="#CC0000" stroke-width="2"/>
    <text x="${x}" y="${y+1}" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="900" fill="#CC0000" font-family="sans-serif">${l}</text>`;
}
function qbC(x,y) {
  return `<circle cx="${x}" cy="${y}" r="${QB_R}" fill="#CC0000" stroke="#E8C96A" stroke-width="2.5" filter="url(#glow)"/>
    <text x="${x}" y="${y+1}" text-anchor="middle" dominant-baseline="middle" font-size="8" font-weight="900" fill="white" font-family="sans-serif">Q</text>`;
}
function rbC(x,y) {
  return `<circle cx="${x}" cy="${y}" r="${RB_R}" fill="#FFEEEE" stroke="#CC0000" stroke-width="2"/>
    <text x="${x}" y="${y+1}" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="900" fill="#CC0000" font-family="sans-serif">B</text>`;
}
function teC(x,y) {
  return `<circle cx="${x}" cy="${y}" r="${TE_R}" fill="#E8C96A" stroke="#8B6914" stroke-width="2"/>
    <text x="${x}" y="${y+1}" text-anchor="middle" dominant-baseline="middle" font-size="7" font-weight="900" fill="#111" font-family="sans-serif">TE</text>`;
}
function olLine() { return OL_POS.map(p => olC(p.x, LOS, p.l)).join(''); }

function drawBase() {
  return fieldSVG(olLine() + wrC(20,LOS,'X') + wrC(282,LOS+SLOT_OFF,'Y') + wrC(322,LOS+SLOT_OFF,'H') + wrC(376,LOS,'Z') + qbC(QX,QY) + rbC(BX,BY), '(10) BASE — 3×1 FIELD');
}
function drawDeuce() {
  return fieldSVG(olLine() + wrC(20,LOS,'X') + wrC(106,LOS+SLOT_OFF,'Y') + wrC(278,LOS+SLOT_OFF,'H') + wrC(376,LOS,'Z') + qbC(QX,QY) + rbC(BX,BY), '(10) DEUCE — 2×2');
}
function drawRT() {
  return fieldSVG(olLine() + wrC(20,LOS,'X') + wrC(106,LOS+SLOT_OFF,'H') + wrC(278,LOS+SLOT_OFF,'Y') + wrC(376,LOS,'Z') + qbC(QX,QY) + rbC(BX,BY), '(10) RT — H BOUNDARY SLOT');
}
function drawCluster() {
  return fieldSVG(olLine() + wrC(20,LOS,'X') + wrC(62,LOS+SLOT_OFF,'H') + wrC(104,LOS+SLOT_OFF,'Y') +
    `<line x1="8" y1="${LOS-18}" x2="8" y2="${LOS+SLOT_OFF+12}" stroke="#E8C96A" stroke-width="1.5" opacity="0.55"/>
     <line x1="118" y1="${LOS-18}" x2="118" y2="${LOS+SLOT_OFF+12}" stroke="#E8C96A" stroke-width="1.5" opacity="0.55"/>
     <line x1="8" y1="${LOS-18}" x2="118" y2="${LOS-18}" stroke="#E8C96A" stroke-width="1.5" opacity="0.55"/>
     <text x="63" y="${LOS-22}" text-anchor="middle" font-size="8" fill="#E8C96A" opacity="0.7" font-family="sans-serif" font-weight="700">CLUSTER</text>` +
    wrC(376,LOS,'Z') + qbC(QX,QY) + rbC(BX,BY), '(10) CLUSTER — 3×1 BOUNDARY');
}
function drawBunch() {
  const ZX=304, ZY=LOS, YX=ZX+24, YY=LOS+20, HX=ZX-24, HY=LOS+20;
  return fieldSVG(olLine() + wrC(20,LOS,'X') + wrC(ZX,ZY,'Z') + wrC(YX,YY,'Y') + wrC(HX,HY,'H') +
    `<line x1="270" y1="${LOS-18}" x2="270" y2="${LOS+34}" stroke="#E8C96A" stroke-width="1.5" opacity="0.55"/>
     <line x1="342" y1="${LOS-18}" x2="342" y2="${LOS+34}" stroke="#E8C96A" stroke-width="1.5" opacity="0.55"/>
     <line x1="270" y1="${LOS-18}" x2="342" y2="${LOS-18}" stroke="#E8C96A" stroke-width="1.5" opacity="0.55"/>
     <text x="306" y="${LOS-22}" text-anchor="middle" font-size="8" fill="#E8C96A" opacity="0.7" font-family="sans-serif" font-weight="700">BUNCH</text>` +
    qbC(QX,QY) + rbC(BX,BY), '(10) BUNCH — TIGHT 3×1 FIELD');
}
function drawEmpty() {
  return fieldSVG(olLine() + wrC(20,LOS,'X') + wrC(106,LOS+SLOT_OFF,'H') + wrC(278,LOS+SLOT_OFF,'Y') + wrC(336,LOS+SLOT_OFF,'A') + wrC(376,LOS,'Z') + qbC(QX,QY), '(00) BASE — 5 WIDE');
}
function drawRay() {
  return fieldSVG(teC(122,LOS) + olLine() + wrC(280,LOS,'X') + wrC(320,LOS+SLOT_OFF,'H') + wrC(376,LOS,'Z') + qbC(QX,QY) + rbC(BX,BY), '(11) RAY — TE BOUNDARY SINGLE');
}

const formations = { BASE: drawBase, DEUCE: drawDeuce, RT: drawRT, CLUSTER: drawCluster, BUNCH: drawBunch, EMPTY: drawEmpty, RAY: drawRay };

const formationInfo = [
  { name:'BASE', personnel:'10', desc:'3×1 to the field. Y/H/Z trips field side, X isolated to the boundary.' },
  { name:'DEUCE', personnel:'10', desc:'2×2 balanced surface. Y+X boundary side, H+Z field side.' },
  { name:'RT', personnel:'10', desc:'H flips into the boundary slot (near LT). X boundary wide, Y field slot, Z field wide.' },
  { name:'CLUSTER', personnel:'10', desc:'3×1 to the BOUNDARY — X/H/Y tight together, Z alone to the field. Opposite of BASE.' },
  { name:'BUNCH', personnel:'10', desc:'Tight 3×1 to the field. Z is the point on the LOS, Y & H stagger behind in a triangle.' },
  { name:'EMPTY', personnel:'00', desc:'5 WRs, no RB on the field — maximum spread (X, H, Y, A, Z).' },
  { name:'RAY', personnel:'11', desc:'TE aligned alone to the boundary. X/H/Z form trips to the field.' },
];

// ==================== ROUTE PATHS / PLAY DIAGRAMS ====================
const ROUTE_COLORS = { Z:'#CC0000', H:'#B8860B', Y:'#1A56DB', X:'#0F8A3C', B:'#D2691E', T:'#7A3FBF' };

const YDS = 7; // px per yard of depth/lateral distance, for realistic route scaling

// Computes the point on a player marker's circle edge along the true direction
// of travel toward the first waypoint, so lines attach cleanly regardless of angle.
function edgePoint(ox, oy, tx, ty, r) {
  const dx = tx - ox, dy = ty - oy;
  const len = Math.hypot(dx, dy) || 1;
  return { x: ox + r * dx / len, y: oy + r * dy / len };
}

// waypoints: [{x,y}] — every segment is a straight cut, matching how routes are
// drawn on a real call sheet (sharp breaks, not rounded curves).
function buildPath(ox, oy, waypoints, r) {
  const start = edgePoint(ox, oy, waypoints[0].x, waypoints[0].y, r);
  let d = `M${start.x},${start.y}`;
  for (const w of waypoints) d += ` L${w.x},${w.y}`;
  return d;
}

function routePath(ox, oy, route, r) {
  const R = route.toUpperCase();
  const toCtr = ox > 194 ? -1 : 1; // toward the center of the field (inside)
  const toOut = -toCtr;            // toward the sideline (outside)
  const y = (yd) => oy - yd * YDS; // y coordinate at a given depth in yards past the LOS
  const wp = (pts) => buildPath(ox, oy, pts, r);
  switch(R) {
    case 'GO': return wp([{x:ox,y:20}]);
    case 'FADE': return wp([{x:ox+toOut*6,y:y(8)},{x:ox+toOut*16,y:20}]);
    case 'HITCH': return wp([{x:ox,y:y(5)},{x:ox+toOut*10,y:y(4.3)}]);
    case 'WIDE HITCH': return wp([{x:ox,y:y(6)},{x:ox+toOut*14,y:y(5.2)}]);
    case '3 SLANT': case 'SLANT': return wp([{x:ox,y:y(1.5)},{x:ox+toCtr*36,y:y(3)}]);
    case '1 SLANT': return wp([{x:ox,y:y(1)},{x:ox+toCtr*22,y:y(2)}]);
    case 'NOW SLANT': return wp([{x:ox+toCtr*22,y:y(1)}]);
    case 'SPRAY SLANT': return wp([{x:ox,y:y(1)},{x:ox+toCtr*48,y:y(2.5)}]);
    case 'WHIP': return wp([{x:ox+toOut*14,y:y(4)},{x:ox+toOut*6,y:y(3.3)}]);
    case 'PIVOT': return wp([{x:ox+toOut*14,y:y(3)},{x:ox,y:y(2)}]);
    case 'QUICK OUT': case 'OUT': return wp([{x:ox,y:y(5)},{x:ox+toOut*30,y:y(5.5)}]);
    case 'ARROW': case 'FLAT': return wp([{x:ox+toOut*6,y:y(1.5)},{x:ox+toOut*40,y:y(2)}]);
    case 'FALLOUT': return wp([{x:ox+toOut*10,y:y(5)},{x:ox+toOut*34,y:y(7)},{x:ox+toOut*22,y:y(5)}]);
    case 'CORNER': return wp([{x:ox,y:y(10)},{x:ox+toOut*32,y:y(14)}]);
    case 'POST': case 'SKINNY POST': return wp([{x:ox,y:y(10)},{x:ox+toCtr*32,y:y(14)}]);
    case 'WHEEL': return wp([{x:ox+toOut*20,y:y(2)},{x:ox+toOut*24,y:20}]);
    case 'SLOT FADE': return wp([{x:ox+toOut*16,y:20}]);
    case 'BEND SEAM': return wp([{x:ox,y:y(10)},{x:ox+toCtr*20,y:y(15)}]);
    case 'CROSS': case 'HI CROSS': return wp([{x:ox,y:y(7)},{x:ox+toCtr*160,y:y(8.5)}]);
    case 'MESH OVER': return wp([{x:ox,y:y(6)},{x:ox+toCtr*145,y:y(6.5)}]);
    case 'MESH UNDER': return wp([{x:ox,y:y(4.5)},{x:ox+toCtr*145,y:y(5)}]);
    case 'SPOT': return wp([{x:ox,y:y(2.5)}]);
    case 'SWING': return wp([{x:ox+toOut*20,y:y(-0.5)},{x:ox+toOut*60,y:y(0)}]);
    case 'RAIL': return wp([{x:ox+toOut*4,y:y(11)}]);
    case 'TUNNEL SCREEN': return wp([{x:ox,y:y(-1.5)},{x:ox+toCtr*32,y:y(-1)}]);
    case 'SUCKER': return wp([{x:ox,y:y(4.3)},{x:ox+toOut*16,y:20}]);
    case 'LOW CROSS': return wp([{x:ox,y:y(7)},{x:ox+toCtr*140,y:y(7.5)}]);
    case 'COMEBACK': return wp([{x:ox,y:y(14)},{x:ox+toOut*6,y:y(12)}]);
    case 'DIG': return wp([{x:ox,y:y(14)},{x:ox+toCtr*60,y:y(14.5)}]);
    case 'POST CURL': return wp([{x:ox,y:y(12)},{x:ox+toCtr*10,y:y(10)}]);
    case 'BENCH': return wp([{x:ox,y:y(10)},{x:ox+toOut*26,y:y(10.5)}]);
    case 'SMOKE': return wp([{x:ox+toOut*4,y:y(-1)}]);
    case 'BLOCK MDM': case 'BLOCK #1': case 'BLOCK #2': return wp([{x:ox+toCtr*20,y:y(1.5)}]);
    case 'CRACK': return wp([{x:ox+toCtr*32,y:y(2)}]);
    case 'RUN OFF STALK': case 'STALK': return wp([{x:ox,y:y(8)}]);
    case 'PUSH 3 VERTICAL KICK OUT #1': case 'PUSH VERTICAL FOR 3 & KICK OUT #2': case 'PUSH 3 VERTICAL KICK OUT #2':
      return wp([{x:ox,y:y(3)},{x:ox+toOut*22,y:y(3.5)}]);
    case '3 STEPS VERTICAL/ RETRACE/ ATTACK BALL/ "RIDE THE WAVE"': case 'RETRACE':
      return wp([{x:ox,y:y(3)},{x:ox+toCtr*30,y:y(3.5)}]);
    default: return wp([{x:ox,y:y(5)}]);
  }
}

function getPlayerPositions(formation) {
  const L = LOS, S = SLOT_OFF;
  const BX_=218, BY_=L+58;
  const pos = {
    BASE:    { X:{x:20,y:L}, Y:{x:282,y:L+S}, H:{x:322,y:L+S}, Z:{x:376,y:L}, B:{x:BX_,y:BY_} },
    DEUCE:   { X:{x:20,y:L}, Y:{x:106,y:L+S}, H:{x:278,y:L+S}, Z:{x:376,y:L}, B:{x:BX_,y:BY_} },
    RT:      { X:{x:20,y:L}, H:{x:106,y:L+S}, Y:{x:278,y:L+S}, Z:{x:376,y:L}, B:{x:BX_,y:BY_} },
    CLUSTER: { X:{x:20,y:L}, H:{x:62,y:L+S},  Y:{x:104,y:L+S}, Z:{x:376,y:L}, B:{x:BX_,y:BY_} },
    BUNCH:   { X:{x:20,y:L}, Z:{x:304,y:L},   Y:{x:328,y:L+20},H:{x:280,y:L+20},B:{x:BX_,y:BY_} },
  };
  return pos[formation] || pos['BASE'];
}

function drawPlaySVG(formation, routes, selectedPos, cardId) {
  const base = formations[formation]();
  const inner = base.replace(/<svg[^>]*>/, '').replace(/<\/svg>$/, '');
  const playerPositions = getPlayerPositions(formation);
  let arrows = '', defs = '', movers = '';
  Object.entries(routes).forEach(([pos, info]) => {
    const pp = playerPositions[pos];
    if (!pp || !info.route || info.route === '-') return;
    const col = ROUTE_COLORS[pos] || '#fff';
    const r = pos === 'B' ? RB_R : (pos === 'Y' || pos === 'T') ? TE_R : WR_R;
    const d = routePath(pp.x, pp.y, info.route, r);
    const isBlock = /^(BLOCK|CRACK|RUN OFF STALK|STALK)/.test(info.route.toUpperCase());
    const opacity = selectedPos === null ? 1 : (selectedPos === pos ? 1 : 0.15);
    const pathId = `${cardId}-path-${pos}`;
    // Real install sheets draw blocking assignments as a solid line ending in a
    // filled dot (no arrowhead, no dash); pass routes get a clean arrowhead.
    const marker = isBlock ? '' : ` marker-end="url(#arrowR${pos})"`;
    arrows += `<path id="${pathId}" d="${d}" stroke="${col}" stroke-width="${selectedPos===pos?2.75:2.25}" fill="none" stroke-linecap="butt" stroke-linejoin="miter" opacity="${opacity}"${marker}/>`;
    if (isBlock) {
      const m = d.match(/L([\d.\-]+),([\d.\-]+)\s*$/);
      if (m) arrows += `<circle cx="${m[1]}" cy="${m[2]}" r="2.5" fill="${col}" opacity="${opacity}"/>`;
    }
    defs += `<defs><marker id="arrowR${pos}" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 Z" fill="${col}"/></marker></defs>`;
    movers += `<g class="mover" data-pos="${pos}" data-ox="${pp.x}" data-oy="${pp.y}" transform="translate(0,0)" opacity="${opacity}">
      <circle cx="${pp.x}" cy="${pp.y}" r="${r}" fill="white" stroke="${col}" stroke-width="2"/>
      <text x="${pp.x}" y="${pp.y+1}" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="900" fill="${col}" font-family="sans-serif">${pos}</text>
    </g>`;
  });
  return `<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" style="display:block" id="${cardId}-svg">${inner}${defs}${arrows}${movers}</svg>`;
}

// Gap-coverage table per front, expressed relative to play side (PS) / back side (BS),

function gapCoverage(front) {
  if (front === 'under') return { psA:true,  psB:false, bsA:false, bsB:true  };
  if (front === 'odd')   return { psA:true,  psB:false, bsA:false, bsB:false };
  if (front === 'bear')  return { psA:true,  psB:true,  bsA:true,  bsB:true  };

}
function psBsGapX(dir) {
  return dir === 'left'

    : { psA:GAP_X.ra, psB:GAP_X.rb, bsA:GAP_X.la, bsB:GAP_X.lb };

const PULL_CURVES = {
  left:  { bsgKick:'M221,162 Q221,192 163,192 Q103,192 100,162', bstLead:'M248,162 Q248,202 163,202 Q108,202 118,130' },

function generalGapBlocks(dir, front, rb) {
  const cov = gapCoverage(front), X = psBsGapX(dir);
  const psT = dir==='left'?140:248, psG = dir==='left'?167:221, c=194, bsG = dir==='left'?221:167, bsT = dir==='left'?248:140;

    {pos:'FST', x:psT, tx:psTargetX, ty:145, blk:true},

// ==================== ROUTE ANIMATION ====================
const playAnimState = {};
function runPlay(cardId) {
  const svg = document.getElementById(cardId+'-svg');
  if (!svg) return;
  playAnimState[cardId] = (playAnimState[cardId] || 0) + 1;
  const token = playAnimState[cardId];
  const movers = [...svg.querySelectorAll('.mover')].map(g => {
    const pos = g.dataset.pos;
    const path = svg.querySelector(`#${cardId}-path-${pos}`);
    if (!path) return null;
    return { g, len: path.getTotalLength(), path, ox: parseFloat(g.dataset.ox), oy: parseFloat(g.dataset.oy) };
  }).filter(Boolean);
  if (!movers.length) return;
  movers.forEach(m => m.g.setAttribute('transform', 'translate(0,0)'));
  const duration = 1700;
  const start = performance.now();
  function frame(now) {
    if (playAnimState[cardId] !== token) return;
    const t = Math.min(1, (now - start) / duration);
    const eased = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
    movers.forEach(m => {
      const pt = m.path.getPointAtLength(eased * m.len);
      m.g.setAttribute('transform', `translate(${pt.x - m.ox},${pt.y - m.oy})`);
    });
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function resetPlay(cardId) {
  playAnimState[cardId] = (playAnimState[cardId] || 0) + 1;
  const svg = document.getElementById(cardId+'-svg');
  if (!svg) return;
  svg.querySelectorAll('.mover').forEach(g => g.setAttribute('transform', 'translate(0,0)'));
}

// ==================== SEARCH ====================
function onSearch() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  document.getElementById('search-clear').style.display = q ? 'block' : 'none';
  const allItems = document.querySelectorAll('[data-search]');
  if (!q) {
    allItems.forEach(el => { el.style.display = ''; });
    return;
  }
  allItems.forEach(el => {
    const matches = el.dataset.search.toLowerCase().includes(q);
    el.style.display = matches ? '' : 'none';
  });
}
function clearSearch() {
  document.getElementById('search-input').value = '';
  onSearch();
}
