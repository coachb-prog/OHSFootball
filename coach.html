// ==================== SELF SCOUT ====================
// Same Hudl-style CSV/columns as Defense Breakdown, but filtered to our own
// offensive snaps (ODK = O) and analyzed for what's working vs. not.
let ssActiveGameId = 'ALL';
let ssActiveTab = null;

function getSSData() {
  const raw = JSON.parse(localStorage.getItem('rd_selfscout') || 'null');
  return (raw && Array.isArray(raw.games)) ? raw : { games: [] };
}
function saveSSData(data) {
  localStorage.setItem('rd_selfscout', JSON.stringify(data));
}
function ssAddGame(label, rows) {
  const data = getSSData();
  data.games.push({ id: 'sg' + Date.now(), label: label || ('GAME ' + (data.games.length + 1)), rows, savedAt: Date.now() });
  saveSSData(data);
}
function ssDeleteGame(gameId) {
  const data = getSSData();
  data.games = data.games.filter(g => g.id !== gameId);
  saveSSData(data);
  if (ssActiveGameId === gameId) ssActiveGameId = 'ALL';
  renderSSGamesList();
  renderSSDashboardFromState();
}
function ssGetActiveRows() {
  const data = getSSData();
  if (ssActiveGameId === 'ALL') return data.games.reduce((acc, g) => acc.concat(g.rows), []);
  const g = data.games.find(g => g.id === ssActiveGameId);
  return g ? g.rows : [];
}
function renderSSDashboardFromState() {
  const rows = ssGetActiveRows();
  if (rows.length) renderSSDashboard(rows);
  else document.getElementById('ss-dashboard').innerHTML = '<div class="db-empty">Upload an offense breakdown file to see season tendencies.</div>';
}

async function handleSSFile(input) {
  const file = input.files[0];
  const statusEl = document.getElementById('ss-upload-status');
  if (!file) return;
  statusEl.textContent = 'Reading file…';
  statusEl.className = 'db-upload-status';
  try {
    const ext = file.name.split('.').pop().toLowerCase();
    let aoa;
    if (ext === 'csv') {
      const text = await file.text();
      aoa = dbParseCSV(text);
    } else {
      await dbLoadXLSXLib();
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
    }
    const rows = dbRowsToObjects(aoa);
    if (!rows.length) throw new Error('No data rows found in that file');
    const label = document.getElementById('ss-game-label').value.trim().toUpperCase();
    ssAddGame(label, rows);
    document.getElementById('ss-game-label').value = '';
    statusEl.textContent = '✅ Loaded ' + rows.length + ' plays';
    statusEl.className = 'db-upload-status ok';
    ssActiveGameId = 'ALL';
    renderSSGamesList();
    renderSSDashboardFromState();
  } catch (err) {
    statusEl.textContent = '❌ ' + err.message;
    statusEl.className = 'db-upload-status err';
  }
  input.value = '';
}

function ssExportData() {
  const data = localStorage.getItem('rd_selfscout') || '{"games":[]}';
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'self-scout-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleSSImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  const statusEl = document.getElementById('ss-upload-status');
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported || !Array.isArray(imported.games)) throw new Error('Invalid file format');
      const data = getSSData();
      const existingIds = new Set(data.games.map(g => g.id));
      let addedGames = 0;
      imported.games.forEach(g => {
        if (!g || !g.id || !Array.isArray(g.rows) || existingIds.has(g.id)) return;
        data.games.push(g);
        existingIds.add(g.id);
        addedGames++;
      });
      saveSSData(data);
      statusEl.textContent = '✅ Imported ' + addedGames + ' game(s)';
      statusEl.className = 'db-upload-status ok';
      renderSSGamesList();
      renderSSDashboardFromState();
    } catch (err) {
      statusEl.textContent = '❌ ' + err.message;
      statusEl.className = 'db-upload-status err';
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function renderSSGamesList() {
  const data = getSSData();
  const listEl = document.getElementById('ss-games-list');
  if (!data.games.length) { listEl.innerHTML = ''; return; }
  const totalPlays = data.games.reduce((s, g) => s + g.rows.length, 0);
  let html = `<div class="db-games-title">GAMES LOADED THIS SEASON</div>`;
  if (data.games.length > 1) {
    html += `<div class="db-game-row db-game-filter${ssActiveGameId === 'ALL' ? ' active' : ''}" data-game-filter="ALL"><span>ALL GAMES — ${totalPlays} plays</span></div>`;
  }
  html += data.games.map(g => {
    return `<div class="db-game-row db-game-filter${ssActiveGameId === g.id ? ' active' : ''}" data-game-filter="${dbEscapeHTML(g.id)}"><span>${dbEscapeHTML(g.label)} — ${g.rows.length} plays</span><span class="db-game-del" data-game-del="${dbEscapeHTML(g.id)}">×</span></div>`;
  }).join('');
  listEl.innerHTML = html;
  listEl.querySelectorAll('.db-game-del').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation(); ssDeleteGame(el.dataset.gameDel); });
  });
  listEl.querySelectorAll('.db-game-filter').forEach(el => {
    el.addEventListener('click', () => {
      ssActiveGameId = el.dataset.gameFilter;
      renderSSGamesList();
      renderSSDashboardFromState();
    });
  });
}

function startSelfScout() {
  showScreen('selfscout-screen');
  renderSSGamesList();
  renderSSDashboardFromState();
}

// ---- offense-specific buckets (reuses dbYards/dbIsTD/dbIsTurnover/dbIsDeadPlay/dbIsOffenseSuccess) ----
function ssIsRun(r) { return String(r.playType == null ? '' : r.playType).trim().toUpperCase().startsWith('R'); }
function ssIsPass(r) { return String(r.playType == null ? '' : r.playType).trim().toUpperCase().startsWith('P'); }
function ssIsComplete(r) { return dbResultStr(r).startsWith('COMPLETE'); }
function ssIsInterception(r) { return dbResultStr(r).includes('INTERCEPTION'); }
function ssIsFumble(r) { return dbResultStr(r).includes('FUMBLE'); }
function ssIsConversion(r) {
  if (dbIsTD(r)) return true;
  const dist = parseFloat(r.dist);
  if (isNaN(dist)) return false;
  return dbYards(r) >= dist;
}
const SS_PROTECTION_CATEGORY = {
  '60': 'QUICK GAME', '61': 'QUICK GAME',
  '90': 'DROP BACK', '91': 'DROP BACK',
  '70': 'PLAYACTION', '80': 'PLAYACTION',
  'RIVER': 'SPRINT OUT', 'LAKE': 'SPRINT OUT',
  'BOSTON': 'BOOTS',
  'RUN': 'RPO',
  'SCREEN': 'SCREENS',
};
const SS_CATEGORY_ORDER = ['QUICK GAME', 'DROP BACK', 'PLAYACTION', 'SPRINT OUT', 'BOOTS', 'RPO', 'SCREENS'];
function ssCategoryBucket(r) {
  const p = String(r.protection == null ? '' : r.protection).trim().toUpperCase();
  return SS_PROTECTION_CATEGORY[p] || null;
}
// Install/concept sheet lookup: maps a charted call word to its real concept/family name, keyed
// by the pass-protection category it's called from (the same call word can mean a different
// concept depending on protection — e.g. "HAWAII" is the HITCHES route as an RPO tag but the ATF
// family as a dropback call). Free-text CONCEPT/TAG fields are inconsistent across charters, so
// this lookup is the source of truth whenever the charted word matches the install.
const SS_CONCEPT_LOOKUP = {
  RUN: { GIANTS: 'INSIDE ZONE', CHARGERS: 'OUTSIDE ZONE', RAMS: 'POWER', CINCY: 'COUNTER', DENVER: 'DUO', BUCS: 'PIN & PULL', CHICAGO: 'ISO' },
  RPO: { HAWAII: 'HITCHES', OREGON: 'OUT', CLEMSON: 'SLANT ARROW', MIAMI: 'SLANT WHEEL', PITTSBURGH: 'SPOT', TEXAS: 'SLOT FADE', COKES: 'GLANCE' },
  'DROP BACK': { HAWAII: 'ATF', OREGON: 'HOLE', TEXAS: 'SMASH', PITTSBURGH: 'HOLE', CLEMSON: 'INSIDE/OUT', MIAMI: 'INSIDE/OUT', FLORIDA: 'FLOOD', LOUISVILLE: 'INSIDE/OUT', TENNESSEE: 'ATF', INDIANA: 'SMASH', KENTUCKY: 'VERT', SYRACUSE: 'STACKING', HOUSTON: 'INSIDE/OUT', MICHIGAN: 'MESH', 'WHIP/DIG': 'STACKING' },
  SCREENS: { SMOKES: 'RPO SCREEN', FSU: 'RUN ACTION SCREEN', LSU: 'PASS ACTION SCREEN', SMU: 'DOUBLE SCREEN', USC: 'SLOW SCREEN' },
  PLAYACTION: { WATER: 'TOP DOWN', ICE: 'TOP DOWN' },
};
function ssConceptFamilyLookup(category, word) {
  const table = SS_CONCEPT_LOOKUP[category];
  if (!table) return null;
  const key = String(word == null ? '' : word).trim().toUpperCase().replace(/\s+/g, ' ');
  return table[key] || null;
}
// OFF PLAY carries a PRO/CON suffix that's just the strong/weak run direction, not part of the
// call's identity — strip it so the same call groups together regardless of run direction.
function ssOffPlayBase(r) {
  const p = String(r.offPlay == null ? '' : r.offPlay).trim().toUpperCase();
  return p.replace(/\b(PRO|CON)\b/g, '').replace(/\s+/g, ' ').trim();
}
// CONCEPT alone doesn't say run-or-pass (RPO rows reuse it for either result), so
// pass/run concept breakdowns must each filter by actual PLAY TYPE (ssIsPass/ssIsRun)
// before grouping — otherwise a run-result RPO snap pollutes the passing numbers and vice versa.
function ssPassConceptBucket(r) {
  const playWord = ssOffPlayBase(r);
  const cat = ssCategoryBucket(r);
  const family = ssConceptFamilyLookup(cat, playWord);
  if (family) return family + ' (' + playWord + ')';
  const c = String(r.concept == null ? '' : r.concept).trim().toUpperCase();
  if (c) return c;
  const t = String(r.passTag == null ? '' : r.passTag).trim().toUpperCase();
  if (t) return t;
  return playWord || null;
}
// For designed runs, CONCEPT is the charted call name itself (GIANTS, RAVENS, DART, ...) and is
// reliable even when OFF PLAY carries a tempo/formation prefix (e.g. "Q CHARGERS PRO") that breaks
// the OFF-PLAY-based lookup below. RUN TAG is NOT a concept on these rows — it holds a blocking-
// scheme/personnel note layered on top of the call (LOCK, SAME, TOSS, LEAD, READ), so a run that
// isn't in the concept sheet must NOT fall back to RUN TAG or it groups under the wrong label.
function ssRunConceptBucket(r) {
  const playWord = ssOffPlayBase(r);
  const c = String(r.concept == null ? '' : r.concept).trim().toUpperCase();
  const callWord = (c && c !== 'NONE') ? c : playWord;
  if (!callWord) return null;
  const family = ssConceptFamilyLookup('RUN', callWord);
  return family ? family + ' (' + callWord + ')' : callWord;
}
// SCRAMBLE means the QB never handed the ball off — the called run concept didn't actually execute,
// so that snap shouldn't count toward the concept's numbers. PENALTY/TIMEOUT are dead plays (no snap).
function ssIsRunHandoff(r) {
  if (dbIsDeadPlay(r)) return false;
  return !dbResultStr(r).includes('SCRAMBLE');
}
function ssRPOComboBucket(r) {
  // RUN TAG holds the called RPO tag (e.g. "HAWAII") on every rep of that call, whether the read
  // ended up a give or a pull — so "GIANTS PRO" + RUN TAG "HAWAII" groups as "GIANTS HAWAII"
  // regardless of which side of the RPO actually hit. Fall back to PASS TAG/CONCEPT only if a
  // row genuinely has no RUN TAG charted.
  const base = ssOffPlayBase(r);
  const tag = String(r.runTag == null ? '' : r.runTag).trim().toUpperCase()
    || String(r.passTag == null ? '' : r.passTag).trim().toUpperCase()
    || String(r.concept == null ? '' : r.concept).trim().toUpperCase();
  const label = (base && tag) ? base + ' ' + tag : (base || tag || '—');
  const route = ssConceptFamilyLookup('RPO', tag);
  return route ? label + ' (' + route + ')' : label;
}

function ssRunPassSplitHTML(rs) {
  const runs = rs.filter(ssIsRun).length;
  const passes = rs.filter(ssIsPass).length;
  return `${runs}R / ${passes}P`;
}

function ssComputeOverall(rows, numGames) {
  const chartable = rows.filter(r => !dbIsDeadPlay(r));
  const runRows = chartable.filter(ssIsRun);
  const passRows = chartable.filter(ssIsPass);
  const passAtt = passRows.length;
  const passComp = passRows.filter(ssIsComplete).length;
  const passYards = passRows.reduce((s, r) => s + dbYards(r), 0);
  const passTD = passRows.filter(dbIsTD).length;
  const passInt = passRows.filter(ssIsInterception).length;
  const rushYards = runRows.reduce((s, r) => s + dbYards(r), 0);
  const rushTD = runRows.filter(dbIsTD).length;
  const rushFumbles = runRows.filter(ssIsFumble).length;
  const totalYards = chartable.reduce((s, r) => s + dbYards(r), 0);
  const totalTD = chartable.filter(dbIsTD).length;
  const thirdDownRows = chartable.filter(r => parseInt(r.down, 10) === 3);
  const fourthDownRows = chartable.filter(r => parseInt(r.down, 10) === 4);
  const thirdConv = thirdDownRows.filter(ssIsConversion).length;
  const fourthConv = fourthDownRows.filter(ssIsConversion).length;
  return {
    total: chartable.length,
    runCount: runRows.length,
    passCount: passRows.length,
    passing: { comp: passComp, att: passAtt, compPct: passAtt ? Math.round(passComp / passAtt * 100) : 0, yards: passYards, ypa: passAtt ? Math.round(passYards / passAtt * 10) / 10 : 0, td: passTD, int: passInt },
    rushing: { carries: runRows.length, yards: rushYards, ypc: runRows.length ? Math.round(rushYards / runRows.length * 10) / 10 : 0, td: rushTD, fumbles: rushFumbles },
    totalYards, yardsPerPlay: chartable.length ? Math.round(totalYards / chartable.length * 10) / 10 : 0,
    yardsPerGame: numGames ? Math.round(totalYards / numGames) : null,
    totalTD,
    successStats: dbSuccessStats(rows),
    thirdDown: { att: thirdDownRows.length, conv: thirdConv, pct: thirdDownRows.length ? Math.round(thirdConv / thirdDownRows.length * 100) : null },
    fourthDown: { att: fourthDownRows.length, conv: fourthConv, pct: fourthDownRows.length ? Math.round(fourthConv / fourthDownRows.length * 100) : null },
  };
}

function ssRenderStats(overall) {
  return `<div class="db-stats-grid">
    <div class="db-stat"><div class="db-stat-num">${overall.total}</div><div class="db-stat-label">PLAYS CHARTED</div></div>
    <div class="db-stat"><div class="db-stat-num">${overall.totalYards}</div><div class="db-stat-label">TOTAL YARDS</div></div>
    <div class="db-stat"><div class="db-stat-num">${overall.yardsPerPlay}</div><div class="db-stat-label">YDS / PLAY</div></div>
    <div class="db-stat"><div class="db-stat-num">${overall.runCount}R / ${overall.passCount}P</div><div class="db-stat-label">RUN-PASS SPLIT</div></div>
    <div class="db-stat"><div class="db-stat-num">${overall.successStats ? overall.successStats.successPct + '%' : '—'}</div><div class="db-stat-label">SUCCESS RATE</div></div>
    <div class="db-stat"><div class="db-stat-num">${overall.totalTD}</div><div class="db-stat-label">OFFENSIVE TDs</div></div>
    <div class="db-stat"><div class="db-stat-num">${overall.thirdDown.pct != null ? overall.thirdDown.pct + '%' : '—'}</div><div class="db-stat-label">3RD DOWN CONV (${overall.thirdDown.conv}/${overall.thirdDown.att})</div></div>
    <div class="db-stat"><div class="db-stat-num">${overall.fourthDown.pct != null ? overall.fourthDown.pct + '%' : '—'}</div><div class="db-stat-label">4TH DOWN CONV (${overall.fourthDown.conv}/${overall.fourthDown.att})</div></div>
  </div>`;
}

function ssRenderPassRushSummary(overall) {
  const p = overall.passing, r = overall.rushing;
  return dbSectionWrap('PASSING & RUSHING SUMMARY', `<div class="db-table-wrap"><table class="db-table">
    <tr><th></th><th>COMP/ATT</th><th>COMP %</th><th>YARDS</th><th>Y/ATT or Y/CARRY</th><th>TD</th><th>INT / FUMBLES</th></tr>
    <tr><td><strong>PASSING</strong></td><td>${p.comp}/${p.att}</td><td>${p.compPct}%</td><td>${p.yards}</td><td>${p.ypa}</td><td>${p.td}</td><td>${p.int}</td></tr>
    <tr><td><strong>RUSHING</strong></td><td>—</td><td>—</td><td>${r.yards}</td><td>${r.ypc}</td><td>${r.td}</td><td>${r.fumbles}</td></tr>
  </table></div>`);
}

function ssSuccessCellHTML(rs) { return dbSuccessCellHTML(rs); }

function ssRenderGroupTable(rows, groupFn, title, columnLabel, orderList) {
  const groups = dbGroupBy(rows, groupFn);
  const buckets = orderList ? orderList.filter(k => groups[k]) : Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);
  if (!buckets.length) return '';
  const trs = buckets.map(b => {
    const rs = groups[b];
    const td = rs.filter(dbIsTD).length;
    const to = rs.filter(r => ssIsInterception(r) || ssIsFumble(r)).length;
    return `<tr${rs.length < DB_LOW_SAMPLE_N ? ' class="db-low-sample"' : ''}>
      <td><strong>${dbEscapeHTML(b)}</strong><br><span style="color:var(--gray);font-size:11px">${rs.length} plays${dbLowSampleTag(rs.length)}</span></td>
      <td>${ssRunPassSplitHTML(rs)}</td>
      <td>${td}</td>
      <td>${to}</td>
      <td>${ssSuccessCellHTML(rs)}</td>
    </tr>`;
  }).join('');
  return dbPanelWrap(title, `<div class="db-table-wrap"><table class="db-table"><tr><th>${columnLabel}</th><th>RUN/PASS</th><th>TD</th><th>TO</th><th>SUCCESS% / AVG YDS</th></tr>${trs}</table></div>`);
}

function ssRenderCategoryTable(rows) {
  // Pass-protection categories describe HOW the ball was protected to throw it, so this
  // table is pass-exclusive: an RPO call that resulted in a run belongs in run concepts, not here.
  const passRows = rows.filter(ssIsPass);
  const groups = dbGroupBy(passRows, ssCategoryBucket);
  const buckets = SS_CATEGORY_ORDER.filter(k => k !== 'RPO' && groups[k]);
  if (!buckets.length) return '<div class="db-empty">No PROTECTION values matched a known pass-concept category yet.</div>';
  const trs = buckets.map(b => {
    const rs = groups[b];
    const comp = rs.filter(ssIsComplete).length;
    const yards = rs.reduce((s, r) => s + dbYards(r), 0);
    const td = rs.filter(dbIsTD).length;
    const to = rs.filter(ssIsInterception).length;
    return `<tr${rs.length < DB_LOW_SAMPLE_N ? ' class="db-low-sample"' : ''}>
      <td><strong>${dbEscapeHTML(b)}</strong><br><span style="color:var(--gray);font-size:11px">${rs.length} attempts${dbLowSampleTag(rs.length)}</span></td>
      <td>${comp}/${rs.length}</td>
      <td>${yards} <span style="color:var(--gray);font-size:11px">(${rs.length ? Math.round(yards / rs.length * 10) / 10 : 0}/att)</span></td>
      <td>${td}</td>
      <td>${to}</td>
      <td>${ssSuccessCellHTML(rs)}</td>
    </tr>`;
  }).join('');
  return dbPanelWrap('BY PASS CONCEPT CATEGORY (PASS RESULTS ONLY)', `<div class="db-table-wrap"><table class="db-table"><tr><th>CATEGORY</th><th>COMP/ATT</th><th>YARDS</th><th>TD</th><th>INT</th><th>SUCCESS% / AVG YDS</th></tr>${trs}</table></div>`);
}

function ssIsRPORow(r) { return ssCategoryBucket(r) === 'RPO'; }
function ssRenderPassConceptTable(rows) {
  // RPO pulls have their own dedicated tab — leave them out here so a run-tagged RPO call
  // doesn't show up as a "pass concept" just because that particular rep was thrown.
  const passRows = rows.filter(r => ssIsPass(r) && !ssIsRPORow(r));
  const groups = dbGroupBy(passRows, ssPassConceptBucket);
  const entries = Object.entries(groups).sort((a, b) => b[1].length - a[1].length).slice(0, 30);
  if (!entries.length) return '<div class="db-empty">No pass plays with a CONCEPT/PASS TAG found yet.</div>';
  const trs = entries.map(([concept, rs]) => {
    const comp = rs.filter(ssIsComplete).length;
    const yards = rs.reduce((s, r) => s + dbYards(r), 0);
    const ypa = rs.length ? Math.round(yards / rs.length * 10) / 10 : 0;
    const td = rs.filter(dbIsTD).length;
    const ints = rs.filter(ssIsInterception).length;
    return `<tr${rs.length < DB_LOW_SAMPLE_N ? ' class="db-low-sample"' : ''}>
      <td><strong>${dbEscapeHTML(concept)}</strong><br><span style="color:var(--gray);font-size:11px">${rs.length} attempts${dbLowSampleTag(rs.length)}</span></td>
      <td>${comp}/${rs.length}</td>
      <td>${yards} <span style="color:var(--gray);font-size:11px">(${ypa}/att)</span></td>
      <td>${td}</td>
      <td>${ints}</td>
      <td>${ssSuccessCellHTML(rs)}</td>
    </tr>`;
  }).join('');
  return dbPanelWrap('BEST PASSING CONCEPTS (PASS RESULTS ONLY)', `<div class="db-table-wrap"><table class="db-table"><tr><th>CONCEPT</th><th>COMP/ATT</th><th>YARDS</th><th>TD</th><th>INT</th><th>SUCCESS% / AVG YDS</th></tr>${trs}</table></div>`);
}

// PRO/CON is the run's strong/weak direction (right/left) — same field ssOffPlayBase
// strips out when grouping concepts, so the direction breakdown reads it back off OFF PLAY directly.
function ssRunDirection(r) {
  const p = String(r.offPlay == null ? '' : r.offPlay).trim().toUpperCase();
  if (/\bPRO\b/.test(p)) return 'RIGHT (PRO)';
  if (/\bCON\b/.test(p)) return 'LEFT (CON)';
  return null;
}
function ssRunDirectionRowHTML(label, rs, indent) {
  const yards = rs.reduce((s, r) => s + dbYards(r), 0);
  const ypc = rs.length ? Math.round(yards / rs.length * 10) / 10 : 0;
  const td = rs.filter(dbIsTD).length;
  const fum = rs.filter(ssIsFumble).length;
  const labelHTML = indent
    ? `<span style="padding-left:14px;color:var(--gray)">↳ ${dbEscapeHTML(label)}</span>`
    : `<strong>${dbEscapeHTML(label)}</strong>`;
  return `<tr${rs.length < DB_LOW_SAMPLE_N ? ' class="db-low-sample"' : ''}>
    <td>${labelHTML}<br><span style="color:var(--gray);font-size:11px">${rs.length} carries${dbLowSampleTag(rs.length)}</span></td>
    <td>${yards}</td>
    <td>${ypc}</td>
    <td>${td}</td>
    <td>${fum}</td>
    <td>${ssSuccessCellHTML(rs)}</td>
  </tr>`;
}
// Shared by the season-wide direction table and the per-concept breakdown below: an OVERALL row
// plus RIGHT (PRO)/LEFT (CON) sub-rows whenever that group actually has carries in that direction.
function ssRunDirectionRowsHTML(overallLabel, rs) {
  const rightRows = rs.filter(r => ssRunDirection(r) === 'RIGHT (PRO)');
  const leftRows = rs.filter(r => ssRunDirection(r) === 'LEFT (CON)');
  let html = ssRunDirectionRowHTML(overallLabel, rs, false);
  if (rightRows.length) html += ssRunDirectionRowHTML('RIGHT (PRO)', rightRows, true);
  if (leftRows.length) html += ssRunDirectionRowHTML('LEFT (CON)', leftRows, true);
  return html;
}
function ssRenderRunDirectionTable(rows) {
  // PROTECTION='RUN' covers both plain designed runs and RPO calls, so it can't be used to
  // exclude RPOs here — include every handoff regardless of protection/category.
  const runRows = rows.filter(r => ssIsRun(r) && ssIsRunHandoff(r));
  if (!runRows.length) return '';
  const rightRows = runRows.filter(r => ssRunDirection(r) === 'RIGHT (PRO)');
  const leftRows = runRows.filter(r => ssRunDirection(r) === 'LEFT (CON)');
  if (!rightRows.length && !leftRows.length) return '';
  const trs = ssRunDirectionRowsHTML('OVERALL', runRows);
  return dbPanelWrap('RUN GAME BY DIRECTION (RUN RESULTS ONLY)', `<div class="db-table-wrap"><table class="db-table"><tr><th>DIRECTION</th><th>YARDS</th><th>Y/CARRY</th><th>TD</th><th>FUM</th><th>SUCCESS% / AVG YDS</th></tr>${trs}</table></div>`);
}

function ssRenderRunConceptTable(rows) {
  // PROTECTION='RUN' covers both plain designed runs and RPO calls, so it can't be used to
  // exclude RPOs here — include every handoff regardless of protection/category.
  const runRows = rows.filter(r => ssIsRun(r) && ssIsRunHandoff(r));
  const groups = dbGroupBy(runRows, ssRunConceptBucket);
  const entries = Object.entries(groups).sort((a, b) => b[1].length - a[1].length);
  if (!entries.length) return '<div class="db-empty">No run plays with a CONCEPT found yet.</div>';
  const trs = entries.map(([tag, rs]) => ssRunDirectionRowsHTML(tag, rs)).join('');
  return dbPanelWrap('BEST RUN CONCEPTS BY DIRECTION (HANDOFFS ONLY)', `<div class="db-table-wrap"><table class="db-table"><tr><th>CONCEPT</th><th>YARDS</th><th>Y/CARRY</th><th>TD</th><th>FUM</th><th>SUCCESS% / AVG YDS</th></tr>${trs}</table></div>`);
}

function ssRenderRPOTable(rows) {
  const rpoRows = rows.filter(r => ssCategoryBucket(r) === 'RPO');
  if (!rpoRows.length) return '<div class="db-empty">No RPO (protection = RUN) plays charted yet.</div>';
  const groups = dbGroupBy(rpoRows, ssRPOComboBucket);
  const entries = Object.entries(groups).sort((a, b) => b[1].length - a[1].length);
  const trs = entries.map(([combo, rs]) => {
    const runRs = rs.filter(ssIsRun);
    const passRs = rs.filter(ssIsPass);
    const runYards = runRs.reduce((s, r) => s + dbYards(r), 0);
    const ypc = runRs.length ? Math.round(runYards / runRs.length * 10) / 10 : 0;
    const comp = passRs.filter(ssIsComplete).length;
    const passYards = passRs.reduce((s, r) => s + dbYards(r), 0);
    const ypa = passRs.length ? Math.round(passYards / passRs.length * 10) / 10 : 0;
    const td = rs.filter(dbIsTD).length;
    const to = rs.filter(r => ssIsInterception(r) || ssIsFumble(r)).length;
    return `<tr${rs.length < DB_LOW_SAMPLE_N ? ' class="db-low-sample"' : ''}>
      <td><strong>${dbEscapeHTML(combo)}</strong><br><span style="color:var(--gray);font-size:11px">OFF PLAY + TAG — ${rs.length} reps${dbLowSampleTag(rs.length)}</span></td>
      <td>${runRs.length} give / ${passRs.length} pull</td>
      <td>${runRs.length ? runYards + ' yds (' + ypc + '/carry)' : '—'}</td>
      <td>${passRs.length ? comp + '/' + passRs.length + ' (' + passYards + ' yds, ' + ypa + '/att)' : '—'}</td>
      <td>${td}</td>
      <td>${to}</td>
      <td>${ssSuccessCellHTML(rs)}</td>
    </tr>`;
  }).join('');
  return dbPanelWrap('RPO — OFF PLAY + TAG EFFICIENCY', `<div class="db-table-wrap"><table class="db-table"><tr><th>OFF PLAY + TAG</th><th>GIVE / PULL</th><th>RUN RESULT</th><th>PASS RESULT</th><th>TD</th><th>TO</th><th>SUCCESS% / AVG YDS</th></tr>${trs}</table></div>`);
}

function ssRenderEffectivenessBarGroup(title, rows, groupFn, n, sortAsc) {
  const groups = dbGroupBy(rows, groupFn);
  const entries = Object.entries(groups)
    .map(([key, rs]) => ({ key, stats: dbSuccessStats(rs) }))
    .filter(e => e.stats && e.stats.n >= 5);
  if (!entries.length) return '';
  entries.sort((a, b) => sortAsc ? a.stats.successPct - b.stats.successPct : b.stats.successPct - a.stats.successPct);
  const top = entries.slice(0, n);
  return `<div><div class="db-bar-group-title">${title}</div>${top.map((e, i) => dbBarRow(e.key, e.stats.successPct, i === 0, e.stats.n)).join('')}</div>`;
}

function ssRenderBarSection(rows) {
  const passRows = rows.filter(ssIsPass);
  const runRows = rows.filter(ssIsRun);
  // RPO has its own dedicated tab, so leave those throws out of the pass concept bars —
  // otherwise an RPO pull shows up as a "pass concept" just because that rep was thrown.
  // (PROTECTION='RUN' covers plain designed runs too, so it can't be used to exclude RPOs
  // from the run side without also dropping legitimate handoffs.)
  const passConceptRows = passRows.filter(r => !ssIsRPORow(r));
  const runConceptRows = runRows.filter(ssIsRunHandoff);
  const groups = [
    dbRenderBarGroup('MOST USED CATEGORIES', dbFreqByFn(passRows, ssCategoryBucket), 7),
    ssRenderEffectivenessBarGroup('MOST SUCCESSFUL CATEGORIES', passRows, ssCategoryBucket, 7, false),
    dbRenderBarGroup('MOST USED PASS CONCEPTS', dbFreqByFn(passConceptRows, ssPassConceptBucket), 6),
    ssRenderEffectivenessBarGroup('MOST SUCCESSFUL PASS CONCEPTS', passConceptRows, ssPassConceptBucket, 6, false),
    ssRenderEffectivenessBarGroup('LEAST SUCCESSFUL PASS CONCEPTS (NEEDS WORK)', passConceptRows, ssPassConceptBucket, 6, true),
    dbRenderBarGroup('MOST USED RUN CONCEPTS', dbFreqByFn(runConceptRows, ssRunConceptBucket), 6),
    ssRenderEffectivenessBarGroup('MOST SUCCESSFUL RUN CONCEPTS', runConceptRows, ssRunConceptBucket, 6, false),
    ssRenderEffectivenessBarGroup('LEAST SUCCESSFUL RUN CONCEPTS (NEEDS WORK)', runConceptRows, ssRunConceptBucket, 6, true),
  ].filter(Boolean);
  if (!groups.length) return '';
  return dbSectionWrap('TENDENCY OVERVIEW', `<div class="db-bar-grid">${groups.join('')}</div>`);
}

// Games array is push-ordered by upload, but a merged import can append out of order —
// sort by savedAt so trend series always read oldest-to-newest regardless of import order.
function ssGamesChronological() {
  return getSSData().games.slice().sort((a, b) => (a.savedAt || 0) - (b.savedAt || 0));
}
// Per-game success series for a concept, so a decline shows up even when the pooled
// season-to-date average still looks fine (an early hot streak can mask a recent slide).
function ssBuildConceptTrend(games, filterFn, bucketFn) {
  const series = {};
  games.forEach(g => {
    const groups = dbGroupBy(g.rows.filter(filterFn), bucketFn);
    Object.entries(groups).forEach(([concept, rs]) => {
      const stats = dbSuccessStats(rs);
      if (!stats) return;
      (series[concept] || (series[concept] = [])).push({ label: g.label, n: stats.n, successPct: stats.successPct });
    });
  });
  return series;
}
const SS_TREND_MIN_TOTAL_N = 8;
const SS_TREND_MIN_GAMES = 2;
const SS_TREND_SHIFT_PCT = 15;
function ssTrendDirection(points) {
  if (points.length < SS_TREND_MIN_GAMES) return null;
  const totalN = points.reduce((s, p) => s + p.n, 0);
  if (totalN < SS_TREND_MIN_TOTAL_N) return null;
  const half = Math.ceil(points.length / 2);
  const wavg = ps => { const n = ps.reduce((s, p) => s + p.n, 0); return n ? ps.reduce((s, p) => s + p.successPct * p.n, 0) / n : null; };
  const earlyAvg = wavg(points.slice(0, half)), recentAvg = wavg(points.slice(half));
  if (earlyAvg == null || recentAvg == null) return null;
  const diff = recentAvg - earlyAvg;
  if (diff <= -SS_TREND_SHIFT_PCT) return 'DOWN';
  if (diff >= SS_TREND_SHIFT_PCT) return 'UP';
  return 'FLAT';
}
function ssRenderConceptTrendTable(games, filterFn, bucketFn, title) {
  const series = ssBuildConceptTrend(games, filterFn, bucketFn);
  const entries = Object.entries(series)
    .map(([concept, points]) => ({ concept, points, totalN: points.reduce((s, p) => s + p.n, 0), dir: ssTrendDirection(points) }))
    .filter(e => e.totalN >= 3)
    .sort((a, b) => b.totalN - a.totalN);
  if (!entries.length) return '';
  const dirHTML = { DOWN: '<span style="color:var(--red)">▼ TRENDING DOWN</span>', UP: '<span style="color:var(--gold)">▲ TRENDING UP</span>', FLAT: '<span style="color:var(--gray)">— STABLE</span>' };
  const trs = entries.map(e => {
    const seq = e.points.map(p => `${dbEscapeHTML(p.label)}: ${p.successPct}%<span style="color:var(--gray);font-size:10px">(${p.n})</span>`).join(' <span style="color:var(--gray)">→</span> ');
    return `<tr${e.totalN < DB_LOW_SAMPLE_N ? ' class="db-low-sample"' : ''}>
      <td><strong>${dbEscapeHTML(e.concept)}</strong><br><span style="color:var(--gray);font-size:11px">${e.totalN} plays across ${e.points.length} game(s)${dbLowSampleTag(e.totalN)}</span></td>
      <td style="font-size:12px">${seq}</td>
      <td>${dirHTML[e.dir] || '<span style="color:var(--gray)">— not enough games yet</span>'}</td>
    </tr>`;
  }).join('');
  return dbPanelWrap(title, `<div class="db-table-wrap"><table class="db-table"><tr><th>CONCEPT</th><th>SUCCESS% BY GAME</th><th>TREND</th></tr>${trs}</table></div>`);
}
function ssRenderTrendsTab() {
  const games = ssGamesChronological();
  if (games.length < 2) return '<div class="db-empty">Load at least 2 games to see week-over-week trends. Trends always cover every game loaded this season, regardless of the game filter above.</div>';
  const body = [
    ssRenderConceptTrendTable(games, r => ssIsPass(r) && !ssIsRPORow(r), ssPassConceptBucket, 'PASS CONCEPT TREND (WEEK BY WEEK)'),
    ssRenderConceptTrendTable(games, r => ssIsRun(r) && ssIsRunHandoff(r), ssRunConceptBucket, 'RUN CONCEPT TREND (WEEK BY WEEK)'),
    ssRenderConceptTrendTable(games, ssIsRPORow, ssRPOComboBucket, 'RPO TREND (WEEK BY WEEK)'),
  ].filter(Boolean).join('');
  return body || '<div class="db-empty">Not enough concept volume yet to show trends.</div>';
}

// Cross-tabs down/distance with formation+personnel so a lopsided run/pass split in a specific
// situation surfaces directly — opposing coordinators will find this same pattern if we don't.
function ssPredictabilityBucket(r) {
  const sit = dbDownDistBucket(r);
  const fp = dbFormPersonnelBucket(r);
  if (!sit || !fp) return null;
  return sit + ' / ' + fp;
}
const SS_PREDICTABILITY_MIN_N = 5;
const SS_PREDICTABILITY_PCT = 75;
function ssPredictabilityEntries(rows) {
  const chartable = rows.filter(r => ssIsRun(r) || ssIsPass(r));
  const groups = dbGroupBy(chartable, ssPredictabilityBucket);
  return Object.entries(groups)
    .map(([combo, rs]) => {
      const runCount = rs.filter(ssIsRun).length;
      const passCount = rs.length - runCount;
      const runPct = Math.round(runCount / rs.length * 100);
      return { combo, rs, runCount, passCount, runPct, lean: Math.max(runPct, 100 - runPct) };
    })
    .filter(e => e.rs.length >= SS_PREDICTABILITY_MIN_N)
    .sort((a, b) => b.lean - a.lean || b.rs.length - a.rs.length);
}
function ssRenderPredictabilityTable(rows) {
  const entries = ssPredictabilityEntries(rows);
  if (!entries.length) return '<div class="db-empty">Not enough plays per situation/formation combo yet to flag tendencies (need at least ' + SS_PREDICTABILITY_MIN_N + ' snaps in the same down/distance + formation/personnel).</div>';
  const trs = entries.map(e => {
    const flagged = e.lean >= SS_PREDICTABILITY_PCT;
    const callLabel = e.runPct >= 50 ? e.runPct + '% RUN' : (100 - e.runPct) + '% PASS';
    return `<tr>
      <td><strong>${dbEscapeHTML(e.combo)}</strong><br><span style="color:var(--gray);font-size:11px">${e.rs.length} snaps</span></td>
      <td>${e.runCount}R / ${e.passCount}P</td>
      <td>${flagged ? '<span style="color:var(--red)">⚠ ' + callLabel + ' — PREDICTABLE</span>' : callLabel}</td>
      <td>${ssSuccessCellHTML(e.rs)}</td>
    </tr>`;
  }).join('');
  return dbPanelWrap('SITUATIONAL PREDICTABILITY (RUN/PASS BY SITUATION + FORMATION)', `<div class="db-table-wrap"><table class="db-table"><tr><th>SITUATION / FORMATION</th><th>RUN / PASS</th><th>TENDENCY</th><th>SUCCESS% / AVG YDS</th></tr>${trs}</table></div>`);
}

function ssGenerateInsights(rows) {
  const items = [];
  // Best/worst categories and concepts — what's working, what needs emphasis.
  [[rows.filter(ssIsPass), ssCategoryBucket, 'pass-concept category'], [rows.filter(r => ssIsPass(r) && !ssIsRPORow(r)), ssPassConceptBucket, 'passing concept'], [rows.filter(r => ssIsRun(r) && ssIsRunHandoff(r)), ssRunConceptBucket, 'run concept']].forEach(([rowSet, groupFn, label]) => {
    const groups = dbGroupBy(rowSet, groupFn);
    const entries = Object.entries(groups)
      .map(([key, rs]) => ({ key, rs, stats: dbSuccessStats(rs) }))
      .filter(e => e.stats && e.stats.n >= 5);
    if (!entries.length) return;
    entries.sort((a, b) => b.stats.successPct - a.stats.successPct);
    const best = entries[0], worst = entries[entries.length - 1];
    if (best && best.stats.successPct >= 60) {
      items.push({ weight: best.rs.length * 2, text: `<strong>${dbEscapeHTML(best.key)}</strong> ${label} is working well — ${best.stats.successPct}% success rate (${best.stats.avgYards} yds/play, ${best.stats.n} plays). Keep leaning on it.` });
    }
    if (worst && worst.stats.successPct <= 35 && worst.key !== (best && best.key)) {
      items.push({ weight: worst.rs.length * 2, text: `<strong>${dbEscapeHTML(worst.key)}</strong> ${label} is struggling — only ${worst.stats.successPct}% success rate (${worst.stats.avgYards} yds/play, ${worst.stats.n} plays). Point of emphasis for the rest of the season.` });
    }
    // High-volume + underperforming = priority fix.
    entries.forEach(e => {
      const usagePct = rows.length ? Math.round(e.rs.length / rows.length * 100) : 0;
      if (usagePct >= 15 && e.stats.successPct <= 40) {
        items.push({ weight: e.rs.length * 3, text: `<strong>${dbEscapeHTML(e.key)}</strong> ${label} is heavily used (${usagePct}% of plays) but only ${e.stats.successPct}% success — high priority to fix or scale back.` });
      } else if (usagePct <= 8 && e.stats.successPct >= 65 && e.stats.n >= 5) {
        items.push({ weight: e.rs.length * 2, text: `<strong>${dbEscapeHTML(e.key)}</strong> ${label} is barely used (${usagePct}% of plays) but ${e.stats.successPct}% success — consider calling it more.` });
      }
    });
  });
  // Situational tendencies — down/distance and field zone effectiveness.
  [[dbDownDistBucket, 'situation'], [dbZoneBucket, 'field zone'], [dbFormPersonnelBucket, 'formation/personnel']].forEach(([fn, label]) => {
    const groups = dbGroupBy(rows, fn);
    Object.entries(groups).forEach(([bucket, rs]) => {
      const stats = dbSuccessStats(rs);
      if (!stats || stats.n < 5) return;
      if (stats.successPct <= 30) {
        items.push({ weight: rs.length * 2, text: `On <strong>${dbEscapeHTML(bucket)}</strong> (${label}), only ${stats.successPct}% success rate (${stats.n} plays) — needs attention.` });
      } else if (stats.successPct >= 70) {
        items.push({ weight: rs.length * 2, text: `On <strong>${dbEscapeHTML(bucket)}</strong> (${label}), ${stats.successPct}% success rate (${stats.n} plays) — a real strength.` });
      }
    });
  });
  // Turnover-prone concepts — interceptions for pass concepts, fumbles for run concepts.
  const passConceptGroups = dbGroupBy(rows.filter(r => ssIsPass(r) && !ssIsRPORow(r)), ssPassConceptBucket);
  Object.entries(passConceptGroups).forEach(([concept, rs]) => {
    if (rs.length < 5) return;
    const toCount = rs.filter(ssIsInterception).length;
    const toPct = Math.round(toCount / rs.length * 100);
    if (toPct >= 15) {
      items.push({ weight: rs.length * 2, text: `<strong>${dbEscapeHTML(concept)}</strong> pass concept has been intercepted on ${toPct}% of its snaps (${toCount}/${rs.length}) — point of emphasis.` });
    }
  });
  const runConceptGroups = dbGroupBy(rows.filter(r => ssIsRun(r) && ssIsRunHandoff(r)), ssRunConceptBucket);
  Object.entries(runConceptGroups).forEach(([concept, rs]) => {
    if (rs.length < 5) return;
    const toCount = rs.filter(ssIsFumble).length;
    const toPct = Math.round(toCount / rs.length * 100);
    if (toPct >= 15) {
      items.push({ weight: rs.length * 2, text: `<strong>${dbEscapeHTML(concept)}</strong> run concept has fumbled on ${toPct}% of its snaps (${toCount}/${rs.length}) — point of emphasis.` });
    }
  });
  // Predictability — a lopsided run/pass split in one situation+formation is as much a
  // self-scout risk as an efficiency problem, since defenses key on it too.
  ssPredictabilityEntries(rows).filter(e => e.lean >= SS_PREDICTABILITY_PCT).forEach(e => {
    const callLabel = e.runPct >= 50 ? e.runPct + '% RUN' : (100 - e.runPct) + '% PASS';
    items.push({ weight: e.rs.length * 2, text: `<strong>${dbEscapeHTML(e.combo)}</strong> is ${callLabel} (${e.rs.length} snaps) — predictable; expect defenses to key on this.` });
  });
  // Trending down — flag even if the pooled season average still looks fine, since an early
  // hot streak can hide a concept that's been getting worse the last few games.
  const trendGames = ssGamesChronological();
  if (trendGames.length >= SS_TREND_MIN_GAMES) {
    [[r => ssIsPass(r) && !ssIsRPORow(r), ssPassConceptBucket, 'passing concept'], [r => ssIsRun(r) && ssIsRunHandoff(r), ssRunConceptBucket, 'run concept']].forEach(([filterFn, bucketFn, label]) => {
      const series = ssBuildConceptTrend(trendGames, filterFn, bucketFn);
      Object.entries(series).forEach(([concept, points]) => {
        if (ssTrendDirection(points) !== 'DOWN') return;
        const totalN = points.reduce((s, p) => s + p.n, 0);
        const last = points[points.length - 1];
        items.push({ weight: totalN * 2, text: `<strong>${dbEscapeHTML(concept)}</strong> ${label} is trending down — down to ${last.successPct}% success in ${dbEscapeHTML(last.label)} after a stronger start to the season. See the TRENDS tab for the week-by-week breakdown.` });
      });
    });
  }
  items.sort((a, b) => b.weight - a.weight);
  return items.slice(0, 30).map(i => i.text);
}

const SS_TABS = [
  { id: 'category', label: 'PASS CATEGORY', render: rows => ssRenderCategoryTable(rows) },
  { id: 'passconcept', label: 'PASS CONCEPTS', render: rows => ssRenderPassConceptTable(rows) },
  { id: 'runconcept', label: 'RUN CONCEPTS', render: rows => ssRenderRunDirectionTable(rows) + ssRenderRunConceptTable(rows) },
  { id: 'rpo', label: 'RPO', render: rows => ssRenderRPOTable(rows) },
  { id: 'trends', label: 'TRENDS', render: () => ssRenderTrendsTab() },
  { id: 'predictability', label: 'PREDICTABILITY', render: rows => ssRenderPredictabilityTable(rows) },
  { id: 'formation', label: 'FORMATION', render: rows => ssRenderGroupTable(rows, dbFormPersonnelBucket, 'BY FORMATION & PERSONNEL', 'FORMATION') },
  { id: 'downdist', label: 'DOWN & DISTANCE', render: rows => ssRenderGroupTable(rows, dbDownDistBucket, 'BY DOWN & DISTANCE', 'SITUATION') },
  { id: 'zone', label: 'FIELD ZONE', render: rows => ssRenderGroupTable(rows, dbZoneBucket, 'BY FIELD ZONE', 'ZONE', DB_ZONE_ORDER) },
  { id: 'hash', label: 'HASH', render: rows => ssRenderGroupTable(rows, dbHashBucket, 'BY HASH', 'HASH') },
];

function ssRenderTabSection(rows) {
  if (!SS_TABS.some(t => t.id === ssActiveTab)) ssActiveTab = SS_TABS[0].id;
  const tabsHtml = SS_TABS.map(t => `<div class="db-tab${t.id === ssActiveTab ? ' active' : ''}" data-tab="${t.id}">${t.label}</div>`).join('');
  const active = SS_TABS.find(t => t.id === ssActiveTab);
  const bodyHtml = active.render(rows) || '<div class="db-empty">No data available for this breakdown.</div>';
  return `<div class="db-tabs">${tabsHtml}</div><div class="db-tab-panel">${bodyHtml}</div>`;
}

function renderSSDashboard(rows) {
  const dash = document.getElementById('ss-dashboard');
  if (!rows || !rows.length) { dash.innerHTML = '<div class="db-empty">No data found in this file.</div>'; return; }
  let offRows = rows.filter(r => String(r.odk == null ? '' : r.odk).trim().toUpperCase().charAt(0) === 'O');
  let usedAll = false;
  if (!offRows.length) { offRows = rows; usedAll = true; }
  const data = getSSData();
  const numGames = ssActiveGameId === 'ALL' ? Math.max(data.games.length, 1) : 1;
  const overall = ssComputeOverall(offRows, numGames);
  const insights = ssGenerateInsights(offRows);
  dash.innerHTML = `
    ${usedAll ? '<div class="db-note">No ODK column marking offensive snaps was found — showing tendencies across all charted plays.</div>' : ''}
    ${ssRenderStats(overall)}
    ${ssRenderPassRushSummary(overall)}
    ${ssRenderBarSection(offRows)}
    ${dbSectionWrap('POINTS OF EMPHASIS', insights.length ? '<ul class="db-insights">' + insights.map(i => `<li>${i}</li>`).join('') + '</ul>' : '<div class="db-empty">Not enough data yet to detect strong patterns. Upload more charted plays.</div>')}
    ${ssRenderTabSection(offRows)}
  `;
  dash.querySelectorAll('.db-section-title').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.secToggle;
      const sec = el.closest('.db-section');
      sec.classList.toggle('collapsed');
      if (sec.classList.contains('collapsed')) dbCollapsedSections.add(key); else dbCollapsedSections.delete(key);
    });
  });
  dash.querySelectorAll('.db-tab').forEach(el => {
    el.addEventListener('click', () => {
      ssActiveTab = el.dataset.tab;
      renderSSDashboard(rows);
    });
  });
}
</script>
</body>
</html>
