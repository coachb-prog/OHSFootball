<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Red Devils Playbook</title>
<style>
:root {
  --red: #CC0000;
  --red-dark: #990000;
  --red-light: #FF4444;
  --black: #111111;
  --black2: #1A1A1A;
  --black3: #242424;
  --white: #FFFFFF;
  --gold: #E8C96A;
  --gold-dark: #C9A84C;
  --green-field: #2A5C14;
  --correct: #1A7A3A;
  --wrong: #7A1A1A;
  --gray: #888888;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--black);
  color: var(--white);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* HEADER */
.header {
  background: var(--red);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
.header-title { font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
.header-xp { font-size: 11px; color: var(--gold); font-weight: 700; }
.back-btn {
  background: rgba(255,255,255,0.2); border: none; color: white;
  padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
  font-weight: 700;
}

/* HOME SCREEN */
#home { background: var(--black); }
.home-hero {
  background: linear-gradient(180deg, #1A0000 0%, var(--black) 100%);
  padding: 32px 20px 24px;
  text-align: center;
  border-bottom: 2px solid var(--red);
}
.logo-wrap { margin-bottom: 16px; }
.home-team { font-size: 28px; font-weight: 900; letter-spacing: 3px; color: var(--white); line-height: 1; }
.home-sub { font-size: 12px; letter-spacing: 4px; color: var(--gold); margin-top: 4px; font-weight: 700; }
.xp-bar-wrap { margin: 16px auto 0; max-width: 320px; }
.xp-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--gold); font-weight: 700; margin-bottom: 4px; }
.xp-bar { background: #333; border-radius: 99px; height: 8px; overflow: hidden; }
.xp-fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); border-radius: 99px; transition: width 0.5s; }
.pos-selector { padding: 16px 20px; background: var(--black2); border-bottom: 1px solid #333; }
.pos-label { font-size: 11px; letter-spacing: 2px; color: var(--gray); margin-bottom: 8px; font-weight: 700; }
.pos-btns { display: flex; gap: 8px; }
.pos-btn {
  flex: 1; padding: 10px 0; border: 2px solid #444; border-radius: 8px;
  background: transparent; color: var(--white); font-size: 14px; font-weight: 800;
  cursor: pointer; transition: all 0.15s;
}
.pos-btn.active { background: var(--red); border-color: var(--red); }
.modes-list { padding: 20px 20px 4px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.modes-section {
  padding: 16px 20px 4px; border-top: 1px solid #2a2a2a;
}
.modes-section:first-of-type { border-top: none; padding-top: 20px; }
.modes-section-title {
  font-size: 11px; font-weight: 800; letter-spacing: 2px; color: var(--gray);
  margin-bottom: 12px; text-transform: uppercase; display: flex; align-items: center; gap: 8px;
}
.modes-section-title .ms-line { flex: 1; height: 1px; background: #2a2a2a; }
.modes-section .modes-list { padding: 0; margin: 0; }
.mode-btn {
  background: var(--black2); border: 1px solid #333; border-radius: 12px;
  padding: 18px 16px; display: flex; align-items: center; gap: 14px;
  cursor: pointer; transition: all 0.15s; text-align: left; color: var(--white);
  min-height: 72px;
}
.mode-btn:hover, .mode-btn:active { background: var(--black3); border-color: var(--red); transform: scale(0.98); }
.mode-btn-featured { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(232,201,106,0.3); }
.mode-btn-featured:hover, .mode-btn-featured:active { border-color: var(--gold); }
.mode-btn-soon { opacity: 0.5; cursor: default; }
.mode-btn-soon:hover, .mode-btn-soon:active { background: var(--black2); border-color: #333; transform: none; }
.mode-icon { font-size: 28px; width: 40px; text-align: center; flex-shrink: 0; }
.mode-info { flex: 1; }
.mode-name { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; }
.mode-desc { font-size: 12px; color: var(--gray); margin-top: 2px; }
.mode-badge { font-size: 11px; color: var(--gold); font-weight: 700; }
.lb-btn {
  margin: 0 20px 20px; background: transparent; border: 2px solid var(--gold);
  border-radius: 10px; padding: 14px; color: var(--gold); font-size: 14px;
  font-weight: 800; cursor: pointer; letter-spacing: 1px;
}

/* QUIZ SHARED */
.quiz-wrap { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
.progress-row { display: flex; align-items: center; gap: 10px; }
.progress-bar { flex: 1; background: #333; border-radius: 99px; height: 6px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--red); border-radius: 99px; transition: width 0.3s; }
.progress-text { font-size: 12px; color: var(--gray); font-weight: 700; min-width: 40px; text-align: right; }
.streak-badge {
  font-size: 12px; font-weight: 800; color: var(--gold);
  background: rgba(232,201,106,0.15); border: 1px solid var(--gold);
  border-radius: 99px; padding: 3px 10px;
}
.question-card {
  background: var(--black2); border: 1px solid #333; border-radius: 14px; padding: 16px;
}
.play-call-label {
  font-size: 11px; letter-spacing: 2px; color: var(--gold); font-weight: 700; margin-bottom: 8px;
}
.play-call-text {
  font-size: 20px; font-weight: 900; color: var(--white); letter-spacing: 1px; margin-bottom: 12px;
}
.question-text { font-size: 15px; font-weight: 600; line-height: 1.4; color: var(--white); }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice-btn {
  background: var(--black3); border: 2px solid #444; border-radius: 10px;
  padding: 16px 14px; font-size: 14px; font-weight: 600; color: var(--white);
  cursor: pointer; text-align: left; transition: all 0.15s; min-height: 52px;
}
.choice-btn:disabled { cursor: default; }
.choice-btn.correct { background: var(--correct); border-color: #2ECC71; color: white; }
.choice-btn.wrong { background: var(--wrong); border-color: var(--red); color: white; }
.choice-btn.reveal { background: rgba(0,180,80,0.2); border-color: #2ECC71; }
.feedback-box {
  background: var(--black2); border-radius: 10px; padding: 14px;
  font-size: 13px; line-height: 1.5; color: #ccc; border-left: 3px solid var(--gold);
  display: none;
}
.feedback-box.show { display: block; }
.next-btn {
  background: var(--red); border: none; border-radius: 10px; padding: 16px;
  color: white; font-size: 16px; font-weight: 800; cursor: pointer;
  letter-spacing: 1px; margin-top: auto;
}

/* SVG DIAGRAM */
.diagram-wrap {
  background: var(--black2); border: 1px solid #333; border-radius: 14px;
  overflow: hidden; display: flex; justify-content: center;
}
.diagram-wrap svg { width: 100%; max-width: 360px; display: block; }

/* SCORE SCREEN */
#score-screen { background: var(--black); justify-content: center; align-items: center; padding: 20px; }
.score-card {
  background: var(--black2); border: 2px solid var(--gold); border-radius: 20px;
  padding: 32px 24px; text-align: center; width: 100%; max-width: 340px;
}
.score-trophy { font-size: 64px; margin-bottom: 12px; }
.score-title { font-size: 22px; font-weight: 900; color: var(--gold); letter-spacing: 2px; }
.score-number { font-size: 56px; font-weight: 900; color: var(--white); line-height: 1; margin: 8px 0; }
.score-sub { font-size: 14px; color: var(--gray); }
.score-xp { font-size: 18px; color: var(--gold); font-weight: 800; margin: 12px 0; }
.score-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.score-actions button {
  padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; border: none;
}
.btn-play-again { background: var(--red); color: white; }
.btn-home { background: var(--black3); color: var(--white); border: 1px solid #444; }

/* COVERAGE DRILL */
.timer-ring-wrap { display: flex; justify-content: center; padding: 8px 0; }
.timer-text { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; }
.coverage-name-display {
  text-align: center; font-size: 48px; font-weight: 900; color: var(--red);
  letter-spacing: 4px; padding: 20px;
  text-shadow: 0 0 20px rgba(204,0,0,0.4);
}

/* PLAY BUILDER */
.builder-wrap { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.drop-zone {
  background: var(--black2); border: 2px dashed #444; border-radius: 12px;
  padding: 12px; min-height: 60px; display: flex; flex-wrap: wrap; gap: 8px;
  align-items: center; transition: border-color 0.2s;
}
.drop-zone.drag-over { border-color: var(--gold); }
.drop-zone-label { font-size: 11px; color: var(--gray); margin-bottom: 4px; letter-spacing: 1px; font-weight: 700; }
.tile {
  background: var(--red); color: white; border: none; border-radius: 8px;
  padding: 10px 14px; font-size: 14px; font-weight: 800; cursor: grab;
  user-select: none; touch-action: none; letter-spacing: 0.5px;
  transition: transform 0.1s, box-shadow 0.1s;
}
.tile.dragging { opacity: 0.5; }
.tile.in-drop { background: var(--black3); border: 2px solid var(--gold); color: var(--gold); cursor: grab; }
.tile-pool { display: flex; flex-wrap: wrap; gap: 8px; background: var(--black2); border-radius: 12px; padding: 12px; border: 1px solid #333; }
.builder-feedback { font-size: 13px; text-align: center; font-weight: 700; padding: 8px; border-radius: 8px; display: none; }
.builder-feedback.correct { background: rgba(0,180,80,0.2); color: #2ECC71; display: block; }
.builder-feedback.wrong { background: rgba(200,0,0,0.2); color: #FF6666; display: block; }
.check-btn {
  background: var(--gold); color: var(--black); border: none; border-radius: 10px;
  padding: 16px; font-size: 16px; font-weight: 900; cursor: pointer; letter-spacing: 1px;
}

/* LEADERBOARD */
#leaderboard { background: var(--black); }
.lb-wrap { padding: 16px; flex: 1; }
.lb-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.lb-tab {
  padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
  border: 1px solid #444; background: var(--black2); color: var(--gray);
  letter-spacing: 0.5px;
}
.lb-tab.active { background: var(--red); color: white; border-color: var(--red); }
.lb-list { display: flex; flex-direction: column; gap: 8px; }
.lb-item {
  background: var(--black2); border-radius: 10px; padding: 14px 16px;
  display: flex; align-items: center; gap: 12px; border: 1px solid #2A2A2A;
}
.lb-rank { font-size: 20px; font-weight: 900; color: var(--gold); min-width: 28px; }
.lb-name { flex: 1; font-size: 15px; font-weight: 700; }
.lb-score { font-size: 18px; font-weight: 900; color: var(--red); }
.lb-empty { text-align: center; color: var(--gray); padding: 40px; font-size: 14px; }

/* NAME ENTRY */
.name-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  display: flex; align-items: center; justify-content: center; z-index: 200;
  padding: 20px; display: none;
}
.name-modal.show { display: flex; }
.name-card { background: var(--black2); border: 2px solid var(--gold); border-radius: 16px; padding: 24px; width: 100%; max-width: 300px; }
.name-card h3 { font-size: 18px; font-weight: 900; color: var(--gold); margin-bottom: 4px; }
.name-card p { font-size: 13px; color: var(--gray); margin-bottom: 16px; }
.name-input {
  width: 100%; padding: 14px; background: var(--black3); border: 2px solid #444;
  border-radius: 8px; color: white; font-size: 16px; font-weight: 700;
  text-transform: uppercase; outline: none; margin-bottom: 12px;
}
.name-input:focus { border-color: var(--gold); }
.name-save-btn { width: 100%; background: var(--red); border: none; border-radius: 8px; padding: 14px; color: white; font-size: 16px; font-weight: 800; cursor: pointer; }

/* TIMER SVG */
.timer-svg { transform: rotate(-90deg); }

/* Motion arrows */
.motion-arrow { stroke: var(--gold); fill: none; stroke-width: 2.5; stroke-dasharray: 4 3; marker-end: url(#arrow); }

/* Responsive */
@media (max-height: 600px) {
  .home-hero { padding: 16px 20px; }
  .home-team { font-size: 22px; }
}

/* PLAY DIAGRAMS */
.pb-wrap { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
.pb-filter-row { display: flex; gap: 0; border-bottom: 2px solid var(--red); }
.pb-filter {
  flex: 1; padding: 12px; background: var(--black2); border: none; color: var(--gray);
  font-size: 13px; font-weight: 800; letter-spacing: 1px; cursor: pointer;
  border-bottom: 3px solid transparent; margin-bottom: -2px;
}
.pb-filter.active { color: var(--white); border-bottom-color: var(--gold); background: var(--black3); }
.pb-play-list { display: flex; flex-direction: column; gap: 0; padding: 8px 0; }
.pb-play-item {
  padding: 16px 20px; border-bottom: 1px solid #222; cursor: pointer;
  display: flex; align-items: center; gap: 12px; background: var(--black2);
}
.pb-play-item:active { background: var(--black3); }
.pb-play-item-name { font-size: 15px; font-weight: 800; flex: 1; }
.pb-play-item-sub { font-size: 11px; color: var(--gray); margin-top: 2px; }
.pb-play-item-family { font-size: 11px; color: var(--gold); font-weight: 700; }
.pb-diagram-area { padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 10px; }
.pb-play-title { font-size: 18px; font-weight: 900; letter-spacing: 1px; color: var(--white); }
.pb-formation-label { font-size: 11px; color: var(--gold); font-weight: 700; letter-spacing: 2px; }
#pb-svg-wrap svg { width: 100%; height: auto; border-radius: 8px; overflow: hidden; }
.pb-legend { display: flex; flex-wrap: wrap; gap: 8px; }
.pb-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
.pb-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.pb-route-table { background: var(--black2); border-radius: 10px; overflow: hidden; }
.pb-route-table table { width: 100%; border-collapse: collapse; font-size: 13px; }
.pb-route-table th { background: var(--red); color: white; padding: 8px 10px; text-align: left; font-size: 11px; letter-spacing: 1px; }
.pb-route-table td { padding: 10px; border-bottom: 1px solid #2a2a2a; vertical-align: top; }
.pb-route-table tr:last-child td { border-bottom: none; }
.pb-route-table tr:hover td { background: var(--black3); }
.pb-pos-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.pb-qb-notes { background: var(--black2); border-radius: 10px; padding: 14px; border-left: 3px solid var(--gold); }
.pb-qb-notes-title { font-size: 11px; color: var(--gold); font-weight: 800; letter-spacing: 2px; margin-bottom: 8px; }
.pb-qb-notes ul { padding-left: 16px; display: flex; flex-direction: column; gap: 5px; }
.pb-qb-notes li { font-size: 13px; color: #ccc; line-height: 1.4; }
.pb-back-btn { background: var(--black3); border: 1px solid #444; border-radius: 10px; color: var(--white); padding: 14px; font-size: 14px; font-weight: 800; cursor: pointer; }

/* DEFENSE BREAKDOWN */
.db-wrap { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.db-card { background: var(--black2); border: 1px solid #333; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.db-card-title { font-size: 11px; letter-spacing: 2px; color: var(--gold); font-weight: 800; }
.db-opp-row { display: flex; flex-wrap: wrap; gap: 8px; }
.db-opp-pill { background: var(--black3); border: 1px solid #444; border-radius: 99px; padding: 6px 10px 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.db-opp-pill.active { background: var(--red); border-color: var(--red); color: white; }
.db-opp-del { color: var(--gray); font-weight: 900; padding: 0 2px; }
.db-opp-pill.active .db-opp-del { color: rgba(255,255,255,0.7); }
.db-input { background: var(--black3); border: 2px solid #444; border-radius: 8px; padding: 12px; color: white; font-size: 14px; font-weight: 700; text-transform: uppercase; outline: none; }
.db-input:focus { border-color: var(--gold); }
.db-upload-btn { display: block; text-align: center; background: var(--red); color: white; border-radius: 10px; padding: 14px; font-size: 14px; font-weight: 800; cursor: pointer; letter-spacing: 0.5px; }
.db-upload-status { font-size: 12px; font-weight: 700; color: var(--gray); min-height: 16px; }
.db-upload-status.ok { color: #2ECC71; }
.db-upload-status.err { color: #FF6666; }
.db-note { font-size: 12px; color: var(--gold); background: rgba(232,201,106,0.1); border-left: 3px solid var(--gold); padding: 10px 12px; border-radius: 6px; }
.db-opp-gamecount { color: var(--gray); font-weight: 700; }
.db-opp-pill.active .db-opp-gamecount { color: rgba(255,255,255,0.7); }
.db-games-title { font-size: 10px; letter-spacing: 1px; color: var(--gray); font-weight: 700; margin-top: 4px; }
.db-game-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--white); background: var(--black3); border-radius: 6px; padding: 6px 10px; margin-top: 4px; }
.db-game-filter { cursor: pointer; border: 1px solid transparent; }
.db-game-filter.active { border-color: var(--red); background: rgba(204,0,0,0.18); }
.db-game-del { color: var(--gray); font-weight: 900; cursor: pointer; padding: 0 4px; }
.db-print-btn { background: var(--black3); border: 1px solid var(--gold); color: var(--gold); border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 800; cursor: pointer; letter-spacing: 0.5px; }
.db-print-btn:hover, .db-print-btn:active { background: var(--gold); color: var(--black); }
.db-backup-row { display: flex; gap: 8px; }
.db-backup-btn { display: block; text-align: center; flex: 1; background: var(--black3); border: 1px solid #444; color: var(--white); border-radius: 10px; padding: 11px; font-size: 12px; font-weight: 800; cursor: pointer; letter-spacing: 0.5px; }
.db-backup-btn:hover, .db-backup-btn:active { background: #333; }
.db-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.db-stat { background: var(--black2); border: 1px solid #333; border-radius: 10px; padding: 14px; text-align: center; }
.db-stat-num { font-size: 18px; font-weight: 900; color: var(--gold); word-break: break-word; }
.db-stat-label { font-size: 10px; color: var(--gray); letter-spacing: 1px; font-weight: 700; margin-top: 4px; }
.db-section { background: var(--black2); border: 1px solid #333; border-radius: 14px; padding: 14px; }
.db-section-title { font-size: 12px; letter-spacing: 2px; color: var(--gold); font-weight: 800; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; }
.db-sec-chevron { transition: transform 0.15s; display: inline-block; }
.db-section.collapsed .db-sec-chevron { transform: rotate(-90deg); }
.db-section.collapsed .db-section-body { display: none; }
.db-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.db-tab { background: var(--black3); border: 1px solid #444; border-radius: 8px; padding: 8px 12px; font-size: 11px; font-weight: 800; letter-spacing: 0.5px; color: var(--gray); cursor: pointer; user-select: none; }
.db-tab:hover { color: var(--white); }
.db-tab.active { background: var(--red); border-color: var(--red); color: white; }
.db-tab-panel { background: var(--black2); border: 1px solid #333; border-radius: 14px; padding: 14px; }
.db-tab-panel-title { font-size: 12px; letter-spacing: 2px; color: var(--gold); font-weight: 800; margin-bottom: 10px; }
.db-insights { display: flex; flex-direction: column; gap: 8px; padding-left: 18px; }
.db-insights li { font-size: 13px; line-height: 1.4; color: #ddd; }
.db-table-wrap { overflow-x: auto; }
.db-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 480px; }
.db-table th { background: var(--red); color: white; padding: 8px; text-align: left; font-size: 10px; letter-spacing: 1px; }
.db-table td { padding: 8px; border-bottom: 1px solid #2a2a2a; vertical-align: top; }
.db-table tr:hover td { background: var(--black3); }
.db-table tr.db-low-sample td { opacity: 0.55; }
.db-low-tag { display: inline-block; color: var(--gold); border: 1px solid var(--gold); border-radius: 4px; padding: 0 4px; font-size: 9px; letter-spacing: 0.5px; margin-left: 4px; white-space: nowrap; }
.db-bar-row.db-low-sample { opacity: 0.55; }
.db-empty { text-align: center; color: var(--gray); padding: 24px; font-size: 13px; }
.db-bar-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.db-bar-group-title { font-size: 11px; color: var(--gray); letter-spacing: 1px; margin-bottom: 6px; font-weight: 700; }
.db-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
.db-bar-label { width: 90px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--white); font-weight: 700; }
.db-bar-track { flex: 1; background: #2a2a2a; border-radius: 4px; height: 14px; overflow: hidden; }
.db-bar-fill { height: 100%; background: var(--gray); border-radius: 4px; }

}

<script>
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() {
  showScreen('coach-home');
}
// ==================== DEFENSE BREAKDOWN ====================
// Expected columns (Hudl-style breakdown export):
// PLAY #, ODK, QTR, HASH, DN, DIST, YARD LN, GN/LS, PLAY TYPE, RESULT, CONCEPT,
// PERSONNEL, OFF FORM, SHIFT, MOTION, OFF PLAY, PASS TAG, RUN TAG, PROTECTION,
// DEF FRONT, STUNT, BLITZ, BLITZ #, COVERAGE, NOTES
const DB_COLUMN_ALIASES = {
  'PLAY #': 'playNum', 'PLAY NUM': 'playNum', 'PLAY': 'playNum',
  'ODK': 'odk',
  'QTR': 'qtr', 'QUARTER': 'qtr',
  'HASH': 'hash',
  'DN': 'down', 'DOWN': 'down',
  'DIST': 'dist', 'DISTANCE': 'dist',
  'YARD LN': 'yardLn', 'YARDLINE': 'yardLn', 'YARD LINE': 'yardLn',
  'GN/LS': 'gainLoss', 'GN LS': 'gainLoss',
  'PLAY TYPE': 'playType',
  'RESULT': 'result',
  'CONCEPT': 'concept',
  'PERSONNEL': 'personnel',
  'OFF FORM': 'offForm', 'OFFENSE FORM': 'offForm', 'OFF FORMATION': 'offForm',
  'SHIFT': 'shift',
  'MOTION': 'motion',
  'OFF PLAY': 'offPlay',
  'PASS TAG': 'passTag',
  'RUN TAG': 'runTag',
  'PROTECTION': 'protection',
  'DEF FRONT': 'defFront', 'DEFENSE FRONT': 'defFront', 'DEF. FRONT': 'defFront',
  'STUNT': 'stunt',
  'BLITZ': 'blitz',
  'BLITZ #': 'blitzNum', 'BLITZ#': 'blitzNum', 'BLITZ NUM': 'blitzNum',
  'COVERAGE': 'coverage',
  'NOTES': 'notes',
};
let currentDefOpponent = null;
let dbCollapsedSections = new Set();
let dbActiveTab = null;
let dbActiveGameId = 'ALL';
let dbXLSXLoading = null;

function dbNormHeader(h) { return String(h == null ? '' : h).trim().toUpperCase().replace(/\s+/g, ' '); }

function dbParseCSV(text) {
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length && r.some(c => String(c).trim() !== ''));
}

function dbLoadXLSXLib() {
  if (window.XLSX) return Promise.resolve();
  if (dbXLSXLoading) return dbXLSXLoading;
  dbXLSXLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Could not reach the spreadsheet library (network/CDN blocked) — try exporting as .csv instead'));
    document.head.appendChild(s);
  });
  return dbXLSXLoading;
}

function dbRowsToObjects(aoa) {
  if (!aoa.length) return [];
  const colMap = {};
  aoa[0].forEach((h, i) => {
    const key = DB_COLUMN_ALIASES[dbNormHeader(h)];
    if (key) colMap[key] = i;
  });
  return aoa.slice(1)
    .filter(r => r && r.some(c => c !== undefined && c !== null && String(c).trim() !== ''))
    .map(r => {
      const o = {};
      Object.entries(colMap).forEach(([key, i]) => { o[key] = r[i]; });
      return o;
    });
}

async function handleDefFile(input) {
  const file = input.files[0];
  const statusEl = document.getElementById('db-upload-status');
  if (!file) return;
  statusEl.textContent = 'Reading file…';
  statusEl.className = 'db-upload-status';
  try {
    const ext = file.name.split('.').pop().toLowerCase();
    let aoa;
    if (ext === 'csv') {
      const text = await file.text();
      aoa = dbParseCSV(text);
    } else {
      await dbLoadXLSXLib();
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
    }
    const rows = dbRowsToObjects(aoa);
    if (!rows.length) throw new Error('No data rows found in that file');
    let name = document.getElementById('db-opp-name').value.trim().toUpperCase();
    if (!name) name = 'OPPONENT ' + (Object.keys(getDefOpponents()).length + 1);
    const label = document.getElementById('db-game-label').value.trim().toUpperCase();
    addGameToOpponent(name, label, rows);
    document.getElementById('db-opp-name').value = '';
    document.getElementById('db-game-label').value = '';
    statusEl.textContent = '✅ Loaded ' + rows.length + ' plays for ' + name;
    statusEl.className = 'db-upload-status ok';
    renderOppList();
    selectDefOpponent(name);
  } catch (err) {
    statusEl.textContent = '❌ ' + err.message;
    statusEl.className = 'db-upload-status err';
  }
  input.value = '';
}

function getDefOpponents() {
  const all = JSON.parse(localStorage.getItem('rd_defbreak') || '{}');
  let migrated = false;
  Object.keys(all).forEach(name => {
    const entry = all[name];
    if (!entry.games) {
      all[name] = { games: [{ id: 'g' + (entry.savedAt || Date.now()), label: 'GAME 1', rows: entry.rows || [], savedAt: entry.savedAt || Date.now() }] };
      migrated = true;
    }
  });
  if (migrated) localStorage.setItem('rd_defbreak', JSON.stringify(all));
  return all;
}
function getOpponentRows(name) {
  const entry = getDefOpponents()[name];
  if (!entry) return [];
  return entry.games.reduce((acc, g) => acc.concat(g.rows), []);
}
function dbGetActiveRows(name) {
  const entry = getDefOpponents()[name];
  if (!entry) return [];
  if (dbActiveGameId === 'ALL') return entry.games.reduce((acc, g) => acc.concat(g.rows), []);
  const g = entry.games.find(g => g.id === dbActiveGameId);
  return g ? g.rows : [];
}
function addGameToOpponent(name, label, rows) {
  const all = getDefOpponents();
  if (!all[name]) all[name] = { games: [] };
  all[name].games.push({ id: 'g' + Date.now(), label: label || ('GAME ' + (all[name].games.length + 1)), rows, savedAt: Date.now() });
  localStorage.setItem('rd_defbreak', JSON.stringify(all));
}
function deleteGame(name, gameId) {
  const all = getDefOpponents();
  if (!all[name]) return;
  all[name].games = all[name].games.filter(g => g.id !== gameId);
  if (!all[name].games.length) {
    delete all[name];
    if (currentDefOpponent === name) {
      currentDefOpponent = null;
      document.getElementById('db-dashboard').innerHTML = '<div class="db-empty">Upload a breakdown file to see opponent tendencies.</div>';
    }
  }
  localStorage.setItem('rd_defbreak', JSON.stringify(all));
  renderOppList();
  if (currentDefOpponent === name) selectDefOpponent(name);
}
function deleteDefOpponent(name) {
  const all = getDefOpponents();
  delete all[name];
  localStorage.setItem('rd_defbreak', JSON.stringify(all));
  if (currentDefOpponent === name) {
    currentDefOpponent = null;
    document.getElementById('db-dashboard').innerHTML = '<div class="db-empty">Upload a breakdown file to see opponent tendencies.</div>';
  }
  renderOppList();
}

function dbExportData() {
  const data = localStorage.getItem('rd_defbreak') || '{}';
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'defense-breakdown-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleDefImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  const statusEl = document.getElementById('db-upload-status');
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported || typeof imported !== 'object') throw new Error('Invalid file format');
      const all = getDefOpponents();
      let addedGames = 0;
      Object.keys(imported).forEach(name => {
        const entry = imported[name];
        if (!entry || !Array.isArray(entry.games)) return;
        if (!all[name]) all[name] = { games: [] };
        const existingIds = new Set(all[name].games.map(g => g.id));
        entry.games.forEach(g => {
          if (!g || !g.id || !Array.isArray(g.rows) || existingIds.has(g.id)) return;
          all[name].games.push(g);
          existingIds.add(g.id);
          addedGames++;
        });
      });
      localStorage.setItem('rd_defbreak', JSON.stringify(all));
      statusEl.textContent = '✅ Imported ' + addedGames + ' game(s)';
      statusEl.className = 'db-upload-status ok';
      renderOppList();
      const names = Object.keys(all);
      if (names.length) selectDefOpponent((currentDefOpponent && all[currentDefOpponent]) ? currentDefOpponent : names[names.length - 1]);
    } catch (err) {
      statusEl.textContent = '❌ ' + err.message;
      statusEl.className = 'db-upload-status err';
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function startDefBreakdown() {
  showScreen('defbreak-screen');
  renderOppList();
  const all = getDefOpponents();
  const names = Object.keys(all);
  if (names.length) {
    selectDefOpponent((currentDefOpponent && all[currentDefOpponent]) ? currentDefOpponent : names[names.length - 1]);
  } else {
    document.getElementById('db-dashboard').innerHTML = '<div class="db-empty">Upload a breakdown file to see opponent tendencies.</div>';
  }
}

function dbEscapeHTML(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderOppList() {
  const all = getDefOpponents();
  const names = Object.keys(all);
  const wrap = document.getElementById('db-opp-list');
  wrap.innerHTML = names.map(n => {
    const esc = dbEscapeHTML(n);
    const gameCount = all[n].games.length;
    return `<div class="db-opp-pill ${n === currentDefOpponent ? 'active' : ''}" data-opp="${esc}">${esc}${gameCount > 1 ? ' <span class="db-opp-gamecount">(' + gameCount + ')</span>' : ''}<span class="db-opp-del" data-opp-del="${esc}">×</span></div>`;
  }).join('');
  wrap.querySelectorAll('.db-opp-del').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation(); deleteDefOpponent(el.dataset.oppDel); });
  });
  wrap.querySelectorAll('.db-opp-pill').forEach(el => {
    el.addEventListener('click', () => selectDefOpponent(el.dataset.opp));
  });
  renderGamesList();
}

function renderGamesList() {
  const listEl = document.getElementById('db-games-list');
  if (!currentDefOpponent) { listEl.innerHTML = ''; return; }
  const entry = getDefOpponents()[currentDefOpponent];
  if (!entry) { listEl.innerHTML = ''; return; }
  const totalPlays = entry.games.reduce((s, g) => s + g.rows.length, 0);
  let html = `<div class="db-games-title">GAMES LOADED FOR ${dbEscapeHTML(currentDefOpponent)}</div>`;
  if (entry.games.length > 1) {
    html += `<div class="db-game-row db-game-filter${dbActiveGameId === 'ALL' ? ' active' : ''}" data-game-filter="ALL"><span>ALL GAMES — ${totalPlays} plays</span></div>`;
  }
  html += entry.games.map(g => {
    return `<div class="db-game-row db-game-filter${dbActiveGameId === g.id ? ' active' : ''}" data-game-filter="${dbEscapeHTML(g.id)}"><span>${dbEscapeHTML(g.label)} — ${g.rows.length} plays</span><span class="db-game-del" data-game-del="${dbEscapeHTML(g.id)}">×</span></div>`;
  }).join('');
  listEl.innerHTML = html;
  listEl.querySelectorAll('.db-game-del').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation(); deleteGame(currentDefOpponent, el.dataset.gameDel); });
  });
  listEl.querySelectorAll('.db-game-filter').forEach(el => {
    el.addEventListener('click', () => {
      dbActiveGameId = el.dataset.gameFilter;
      renderGamesList();
      const rows = dbGetActiveRows(currentDefOpponent);
      renderDefDashboard(rows);
    });
  });
}

function selectDefOpponent(name) {
  currentDefOpponent = name;
  dbActiveGameId = 'ALL';
  renderOppList();
  const rows = dbGetActiveRows(name);
  if (rows.length) renderDefDashboard(rows);
}

const DB_LOW_SAMPLE_N = 5;
function dbLowSampleTag(n) {
  return n < DB_LOW_SAMPLE_N ? ' <span class="db-low-tag">LOW SAMPLE</span>' : '';
}
function dbFreq(rows, field) {
  const counts = {}; let total = 0;
  rows.forEach(r => {
    const v = String(r[field] == null ? '' : r[field]).trim().toUpperCase();
    if (!v) return;
    counts[v] = (counts[v] || 0) + 1; total++;
  });
  return { counts, total };
}
function dbTop({ counts, total }, n) {
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, n)
    .map(([label, count]) => ({ label, count, pct: total ? Math.round(count / total * 100) : 0 }));
}
function dbGroupBy(rows, fn) {
  const g = {};
  rows.forEach(r => {
    const k = fn(r);
    if (k === null || k === undefined || k === '') return;
    (g[k] = g[k] || []).push(r);
  });
  return g;
}
function dbIsBlitz(r) {
  const v = String(r.blitz == null ? '' : r.blitz).trim().toUpperCase();
  if (!v) return false;
  return !['N', 'NO', 'NONE', '0'].includes(v);
}
function dbBlitzLabel(r) {
  const bn = String(r.blitzNum == null ? '' : r.blitzNum).trim().toUpperCase();
  if (bn) return bn;
  const st = String(r.stunt == null ? '' : r.stunt).trim().toUpperCase();
  return st || null;
}
function dbYards(r) {
  const v = parseFloat(r.gainLoss);
  return isNaN(v) ? 0 : v;
}
function dbResultStr(r) {
  return String(r.result == null ? '' : r.result).trim().toUpperCase();
}
function dbIsTurnover(r) {
  const v = dbResultStr(r);
  return v.includes('FUMBLE') || v.includes('INT');
}
function dbIsTD(r) {
  return dbResultStr(r).includes('TD');
}
function dbIsDeadPlay(r) {
  const v = dbResultStr(r);
  return v.includes('PENALTY') || v.includes('TIMEOUT');
}
function dbIsOffenseSuccess(r) {
  if (dbIsTurnover(r)) return false;
  if (dbIsTD(r)) return true;
  const down = parseInt(r.down, 10);
  const dist = parseFloat(r.dist);
  const yards = dbYards(r);
  if (!dist || isNaN(dist) || dist <= 0) return yards >= 4;
  let needed;
  if (!down || down <= 1) needed = dist * 0.5;
  else if (down === 2) needed = dist * 0.7;
  else needed = dist;
  return yards >= needed;
}
function dbSuccessStats(rows) {
  const chartable = rows.filter(r => !dbIsDeadPlay(r));
  if (!chartable.length) return null;
  const successCount = chartable.filter(dbIsOffenseSuccess).length;
  const totalYards = chartable.reduce((s, r) => s + dbYards(r), 0);
  return {
    successPct: Math.round(successCount / chartable.length * 100),
    avgYards: Math.round(totalYards / chartable.length * 10) / 10,
    n: chartable.length
  };
}
function dbFreqByFn(rows, fn) {
  const counts = {}; let total = 0;
  rows.forEach(r => {
    const v = fn(r);
    if (!v) return;
    counts[v] = (counts[v] || 0) + 1; total++;
  });
  return { counts, total };
}
function dbDownDistBucket(r) {
  const d = parseInt(r.down, 10);
  if (isNaN(d)) return null;
  if (d === 1) return '1ST DOWN';
  const dist = parseFloat(r.dist);
  const ord = d === 2 ? '2ND' : d === 3 ? '3RD' : d === 4 ? '4TH' : d + 'TH';
  if (isNaN(dist)) return ord + ' DOWN';
  const tag = dist <= 3 ? 'SHORT' : dist <= 6 ? 'MEDIUM' : 'LONG';
  return ord + ' & ' + tag;
}
function dbHashBucket(r) {
  const v = String(r.hash == null ? '' : r.hash).trim().toUpperCase();
  if (v === 'L') return 'LEFT HASH';
  if (v === 'R') return 'RIGHT HASH';
  if (v === 'M') return 'MIDDLE';
  return v || null;
}
function dbZoneBucket(r) {
  const y = parseFloat(r.yardLn);
  if (isNaN(y)) return null;
  if (y <= -20) return 'BACKED UP (OWN TERRITORY)';
  if (y <= 10) return 'GOALLINE (+10 AND IN)';
  if (y <= 25) return 'REDZONE (+25 TO +11)';
  if (y <= 35) return 'FRINGE (+35 TO +26)';
  return 'OPEN FIELD (MIDFIELD)';
}
function dbFormBucket(r) {
  const v = String(r.offForm == null ? '' : r.offForm).trim().toUpperCase();
  return v || null;
}
function dbPersonnelBucket(r) {
  const v = String(r.personnel == null ? '' : r.personnel).trim().toUpperCase();
  return v || null;
}
function dbFormPersonnelBucket(r) {
  const f = String(r.offForm == null ? '' : r.offForm).trim().toUpperCase();
  const p = String(r.personnel == null ? '' : r.personnel).trim().toUpperCase();
  if (!f) return null;
  return p ? f + ' — ' + p : f;
}

function dbComputeOverall(rows) {
  const total = rows.length;
  const frontFreq = dbFreq(rows, 'defFront');
  const covFreq = dbFreq(rows, 'coverage');
  const stuntFreq = dbFreq(rows, 'stunt');
  const blitzCount = rows.filter(dbIsBlitz).length;
  const successStats = dbSuccessStats(rows);
  return { total, frontFreq, covFreq, stuntFreq, blitzCount, blitzPct: total ? Math.round(blitzCount / total * 100) : 0, successStats };
}

function dbComboKey(r) {
  const f = String(r.defFront == null ? '' : r.defFront).trim().toUpperCase();
  const c = String(r.coverage == null ? '' : r.coverage).trim().toUpperCase();
  if (!f || !c) return null;
  return f + ' / ' + c;
}
function dbDefFrontBucket(r) {
  const v = String(r.defFront == null ? '' : r.defFront).trim().toUpperCase();
  return v || null;
}
function dbCoverageBucket(r) {
  const v = String(r.coverage == null ? '' : r.coverage).trim().toUpperCase();
  return v || null;
}

function dbGenerateInsights(rows) {
  const items = [];
  // Most common single front+coverage call overall — the headline conclusion.
  const comboGroups = dbGroupBy(rows, dbComboKey);
  const comboEntries = Object.entries(comboGroups).sort((a, b) => b[1].length - a[1].length);
  if (comboEntries.length) {
    const [combo, rs] = comboEntries[0];
    const pct = rows.length ? Math.round(rs.length / rows.length * 100) : 0;
    if (rs.length >= 3) {
      items.push({ weight: rows.length * 3, text: `Most common defensive call is <strong>${dbEscapeHTML(combo)}</strong> — ${pct}% of all snaps (${rs.length}/${rows.length}).` });
    }
  }
  // Front -> coverage/blitz pairing: "out of 4-2, what do they play behind it?"
  [['defFront', dbDefFrontBucket, 'front'], ['coverage', dbCoverageBucket, 'coverage']].forEach(([groupField, groupFn, groupLabel]) => {
    const otherField = groupField === 'defFront' ? 'coverage' : 'defFront';
    const otherLabel = groupField === 'defFront' ? 'coverage' : 'front';
    const groups = dbGroupBy(rows, groupFn);
    Object.entries(groups).forEach(([key, rs]) => {
      if (rs.length < 3) return;
      const fc = dbFreq(rs, otherField);
      if (fc.total < 3) return;
      const top = dbTop(fc, 1)[0];
      if (top && top.pct >= 50) {
        items.push({ weight: rs.length * 2, text: `Out of <strong>${dbEscapeHTML(key)}</strong> ${groupLabel} (${rs.length} snaps), shows <strong>${dbEscapeHTML(top.label)}</strong> ${otherLabel} ${top.pct}% of the time (${top.count}/${fc.total}).` });
      }
      const blitzCount = rs.filter(dbIsBlitz).length;
      const blitzPct = Math.round(blitzCount / rs.length * 100);
      if (blitzPct >= 40) {
        items.push({ weight: rs.length * 2, text: `Out of <strong>${dbEscapeHTML(key)}</strong> ${groupLabel} (${rs.length} snaps), blitzes ${blitzPct}% of the time.` });
      }
    });
  });
  // Situational tendencies (down/distance, hash, field zone, formation/personnel faced).
  [dbDownDistBucket, dbHashBucket, dbZoneBucket, dbFormBucket, dbPersonnelBucket].forEach(fn => {
    const groups = dbGroupBy(rows, fn);
    Object.entries(groups).forEach(([bucket, rs]) => {
      if (rs.length < 3) return;
      [['defFront', 'front'], ['coverage', 'coverage'], ['stunt', 'stunt']].forEach(([field, label]) => {
        const fc = dbFreq(rs, field);
        if (fc.total < 3) return;
        const top = dbTop(fc, 1)[0];
        if (top && top.pct >= 50) {
          items.push({ weight: rs.length, text: `On <strong>${dbEscapeHTML(bucket)}</strong> (${rs.length} snaps), shows <strong>${dbEscapeHTML(top.label)}</strong> ${label} ${top.pct}% of the time.` });
        }
      });
      const blitzCount = rs.filter(dbIsBlitz).length;
      const blitzPct = Math.round(blitzCount / rs.length * 100);
      if (blitzPct >= 40) {
        items.push({ weight: rs.length, text: `On <strong>${dbEscapeHTML(bucket)}</strong> (${rs.length} snaps), blitzes ${blitzPct}% of the time.` });
      }
    });
  });
  // Effectiveness: which calls allow the highest/lowest offensive success rate.
  [[dbDefFrontBucket, 'front'], [dbCoverageBucket, 'coverage']].forEach(([groupFn, label]) => {
    const groups = dbGroupBy(rows, groupFn);
    Object.entries(groups).forEach(([key, rs]) => {
      const stats = dbSuccessStats(rs);
      if (!stats || stats.n < 5) return;
      if (stats.successPct <= 30) {
        items.push({ weight: rs.length * 2, text: `<strong>${dbEscapeHTML(key)}</strong> ${label} is highly effective — only ${stats.successPct}% offensive success allowed (${stats.avgYards} yds/play, ${stats.n} snaps).` });
      } else if (stats.successPct >= 70) {
        items.push({ weight: rs.length * 2, text: `<strong>${dbEscapeHTML(key)}</strong> ${label} is getting exploited — ${stats.successPct}% offensive success allowed (${stats.avgYards} yds/play, ${stats.n} snaps).` });
      }
    });
  });
  items.sort((a, b) => b.weight - a.weight);
  return items.slice(0, 30).map(i => i.text);
}

function dbRenderStats(overall) {
  const topFront = dbTop(overall.frontFreq, 1)[0];
  const topCov = dbTop(overall.covFreq, 1)[0];
  return `<div class="db-stats-grid">
    <div class="db-stat"><div class="db-stat-num">${overall.total}</div><div class="db-stat-label">SNAPS CHARTED</div></div>
    <div class="db-stat"><div class="db-stat-num">${topFront ? dbEscapeHTML(topFront.label) : '—'}</div><div class="db-stat-label">TOP FRONT</div></div>
    <div class="db-stat"><div class="db-stat-num">${topCov ? dbEscapeHTML(topCov.label) : '—'}</div><div class="db-stat-label">TOP COVERAGE</div></div>
    <div class="db-stat"><div class="db-stat-num">${overall.blitzPct}%</div><div class="db-stat-label">BLITZ RATE</div></div>
    <div class="db-stat"><div class="db-stat-num">${overall.successStats ? overall.successStats.successPct + '%' : '—'}</div><div class="db-stat-label">OFF SUCCESS% ALLOWED</div></div>
    <div class="db-stat"><div class="db-stat-num">${overall.successStats ? overall.successStats.avgYards : '—'}</div><div class="db-stat-label">AVG YDS ALLOWED</div></div>
  </div>`;
}

function dbSectionWrap(title, bodyHtml) {
  const key = dbEscapeHTML(title);
  return `<div class="db-section${dbCollapsedSections.has(key) ? ' collapsed' : ''}" data-sec-key="${key}">
    <div class="db-section-title" data-sec-toggle="${key}"><span class="db-sec-chevron">▾</span> ${title}</div>
    <div class="db-section-body">${bodyHtml}</div>
  </div>`;
}

function dbPanelWrap(title, bodyHtml) {
  return `<div class="db-tab-panel-title">${title}</div>${bodyHtml}`;
}

function dbFreqDistHTML(freq, n) {
  const all = dbTop(freq, 9999);
  if (!all.length) return '—';
  const shown = all.slice(0, n);
  const rest = all.slice(n);
  let html = shown.map((t, i) => i === 0
    ? `<strong>${dbEscapeHTML(t.label)}</strong> <span style="color:var(--gold)">${t.pct}%</span>`
    : `<span style="color:var(--gray)">${dbEscapeHTML(t.label)} <span style="color:var(--gold)">${t.pct}%</span></span>`
  ).join('<br>');
  if (rest.length) {
    const restPct = rest.reduce((s, t) => s + t.pct, 0);
    html += `<br><span style="color:var(--gray);font-size:10px">+${rest.length} more (${restPct}%)</span>`;
  }
  return html;
}

function dbSuccessCellHTML(rs) {
  const stats = dbSuccessStats(rs);
  if (!stats) return '—';
  return `${stats.successPct}%<br><span style="color:var(--gray);font-size:11px">${stats.avgYards} yds/play</span>`;
}

function dbRenderGroupTable(rows, groupFn, title) {
  const groups = dbGroupBy(rows, groupFn);
  const buckets = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);
  if (!buckets.length) return '';
  const trs = buckets.map(b => {
    const rs = groups[b];
    const blitzPct = rs.length ? Math.round(rs.filter(dbIsBlitz).length / rs.length * 100) : 0;
    return `<tr${rs.length < DB_LOW_SAMPLE_N ? ' class="db-low-sample"' : ''}>
      <td><strong>${dbEscapeHTML(b)}</strong><br><span style="color:var(--gray);font-size:11px">${rs.length} snaps${dbLowSampleTag(rs.length)}</span></td>
      <td>${dbFreqDistHTML(dbFreq(rs, 'defFront'), 4)}</td>
      <td>${dbFreqDistHTML(dbFreq(rs, 'coverage'), 4)}</td>
      <td>${blitzPct}%</td>
      <td>${dbFreqDistHTML(dbFreq(rs, 'stunt'), 3)}</td>
      <td>${dbSuccessCellHTML(rs)}</td>
    </tr>`;
  }).join('');
  return dbPanelWrap(title, `<div class="db-table-wrap"><table class="db-table"><tr><th>SITUATION</th><th>FRONTS (ALL)</th><th>COVERAGES (ALL)</th><th>BLITZ %</th><th>STUNTS (ALL)</th><th>OFF SUCCESS% ALLOWED</th></tr>${trs}</table></div>`);
}

function dbRenderComboTable(rows, title) {
  const groups = dbGroupBy(rows, dbComboKey);
  const entries = Object.entries(groups).sort((a, b) => b[1].length - a[1].length).slice(0, 8);
  if (!entries.length) return '';
  const total = rows.length;
  const trs = entries.map(([combo, rs]) => {
    const pct = total ? Math.round(rs.length / total * 100) : 0;
    const blitzPct = rs.length ? Math.round(rs.filter(dbIsBlitz).length / rs.length * 100) : 0;
    const stunt = dbTop(dbFreq(rs, 'stunt'), 1)[0];
    return `<tr${rs.length < DB_LOW_SAMPLE_N ? ' class="db-low-sample"' : ''}>
      <td><strong>${dbEscapeHTML(combo)}</strong></td>
      <td>${rs.length} <span style="color:var(--gold)">(${pct}%)</span>${dbLowSampleTag(rs.length)}</td>
      <td>${blitzPct}%</td>
      <td>${stunt ? dbEscapeHTML(stunt.label) + ' <span style="color:var(--gold)">' + stunt.pct + '%</span>' : '—'}</td>
      <td>${dbSuccessCellHTML(rs)}</td>
    </tr>`;
  }).join('');
  return dbPanelWrap(title, `<div class="db-table-wrap"><table class="db-table"><tr><th>FRONT / COVERAGE</th><th>SNAPS</th><th>BLITZ %</th><th>TOP STUNT</th><th>OFF SUCCESS% ALLOWED</th></tr>${trs}</table></div>`);
}

function dbRenderPairTable(rows, groupFn, groupColLabel, otherField, otherColLabel, title) {
  const groups = dbGroupBy(rows, groupFn);
  const entries = Object.entries(groups).sort((a, b) => b[1].length - a[1].length);
  if (!entries.length) return '';
  const total = rows.length;
  const trs = entries.map(([key, rs]) => {
    const pct = total ? Math.round(rs.length / total * 100) : 0;
    const blitzPct = rs.length ? Math.round(rs.filter(dbIsBlitz).length / rs.length * 100) : 0;
    return `<tr${rs.length < DB_LOW_SAMPLE_N ? ' class="db-low-sample"' : ''}>
      <td><strong>${dbEscapeHTML(key)}</strong><br><span style="color:var(--gray);font-size:11px">${rs.length} snaps (${pct}%)${dbLowSampleTag(rs.length)}</span></td>
      <td>${dbFreqDistHTML(dbFreq(rs, otherField), 4)}</td>
      <td>${blitzPct}%</td>
      <td>${dbFreqDistHTML(dbFreq(rs, 'stunt'), 3)}</td>
      <td>${dbSuccessCellHTML(rs)}</td>
    </tr>`;
  }).join('');
  return dbPanelWrap(title, `<div class="db-table-wrap"><table class="db-table"><tr><th>${groupColLabel}</th><th>${otherColLabel} (ALL)</th><th>BLITZ %</th><th>STUNTS (ALL)</th><th>OFF SUCCESS% ALLOWED</th></tr>${trs}</table></div>`);
}

function dbRenderTopBlitzesByFront(rows, topN) {
  const blitzRows = rows.filter(dbIsBlitz);
  if (!blitzRows.length) return '';
  const groups = dbGroupBy(blitzRows, dbDefFrontBucket);
  const entries = Object.entries(groups).sort((a, b) => b[1].length - a[1].length).slice(0, topN);
  if (!entries.length) return '';
  const trs = entries.map(([front, rs]) => {
    const pct = blitzRows.length ? Math.round(rs.length / blitzRows.length * 100) : 0;
    return `<tr${rs.length < DB_LOW_SAMPLE_N ? ' class="db-low-sample"' : ''}>
      <td><strong>${dbEscapeHTML(front)}</strong><br><span style="color:var(--gray);font-size:11px">${rs.length} blitz snaps (${pct}% of all blitzes)${dbLowSampleTag(rs.length)}</span></td>
      <td>${dbFreqDistHTML(dbFreqByFn(rs, dbBlitzLabel), 4)}</td>
      <td>${dbFreqDistHTML(dbFreq(rs, 'coverage'), 3)}</td>
      <td>${dbSuccessCellHTML(rs)}</td>
    </tr>`;
  }).join('');
  return dbPanelWrap('TOP BLITZES BY FRONT', `<div class="db-table-wrap"><table class="db-table"><tr><th>FRONT</th><th>BLITZ CALLS (ALL)</th><th>COVERAGE BEHIND IT</th><th>OFF SUCCESS% ALLOWED</th></tr>${trs}</table></div>`);
}

const DB_ZONE_ORDER = ['BACKED UP (OWN TERRITORY)', 'OPEN FIELD (MIDFIELD)', 'FRINGE (+35 TO +26)', 'REDZONE (+25 TO +11)', 'GOALLINE (+10 AND IN)'];

function dbRenderZoneTable(rows) {
  const groups = dbGroupBy(rows, dbZoneBucket);
  const buckets = DB_ZONE_ORDER.filter(z => groups[z]);
  if (!buckets.length) return '';
  const trs = buckets.map(b => {
    const rs = groups[b];
    const blitzPct = rs.length ? Math.round(rs.filter(dbIsBlitz).length / rs.length * 100) : 0;
    return `<tr${rs.length < DB_LOW_SAMPLE_N ? ' class="db-low-sample"' : ''}>
      <td><strong>${dbEscapeHTML(b)}</strong><br><span style="color:var(--gray);font-size:11px">${rs.length} snaps${dbLowSampleTag(rs.length)}</span></td>
      <td>${dbFreqDistHTML(dbFreqByFn(rs, dbDownDistBucket), 4)}</td>
      <td>${dbFreqDistHTML(dbFreq(rs, 'defFront'), 4)}</td>
      <td>${dbFreqDistHTML(dbFreq(rs, 'coverage'), 4)}</td>
      <td>${blitzPct}%</td>
      <td>${dbFreqDistHTML(dbFreq(rs, 'stunt'), 3)}</td>
      <td>${dbSuccessCellHTML(rs)}</td>
    </tr>`;
  }).join('');
  return dbPanelWrap('BY FIELD ZONE', `<div class="db-table-wrap"><table class="db-table"><tr><th>ZONE</th><th>DOWN & DISTANCE (ALL)</th><th>FRONTS (ALL)</th><th>COVERAGES (ALL)</th><th>BLITZ %</th><th>STUNTS (ALL)</th><th>OFF SUCCESS% ALLOWED</th></tr>${trs}</table></div>`);
}

function dbBarRow(label, pct, isTop, count) {
  const lowSample = count != null && count < DB_LOW_SAMPLE_N;
  return `<div class="db-bar-row${lowSample ? ' db-low-sample' : ''}"><span class="db-bar-label">${dbEscapeHTML(label)}</span><div class="db-bar-track"><div class="db-bar-fill${isTop ? ' top' : ''}" style="width:${pct}%"></div></div><span class="db-bar-pct">${pct}%${lowSample ? dbLowSampleTag(count) : ''}</span></div>`;
}

function dbRenderBarGroup(title, freq, n) {
  const top = dbTop(freq, n);
  if (!top.length) return '';
  return `<div><div class="db-bar-group-title">${title}</div>${top.map((t, i) => dbBarRow(t.label, t.pct, i === 0, t.count)).join('')}</div>`;
}

function dbRenderEffectivenessBarGroup(title, rows, groupFn, n) {
  const groups = dbGroupBy(rows, groupFn);
  const entries = Object.entries(groups)
    .map(([key, rs]) => ({ key, stats: dbSuccessStats(rs) }))
    .filter(e => e.stats && e.stats.n >= 5);
  if (!entries.length) return '';
  entries.sort((a, b) => a.stats.successPct - b.stats.successPct);
  const top = entries.slice(0, n);
  return `<div><div class="db-bar-group-title">${title}</div>${top.map((e, i) => dbBarRow(e.key, e.stats.successPct, i === 0, e.stats.n)).join('')}</div>`;
}

function dbRenderBarSection(rows) {
  const blitzFreq = dbFreqByFn(rows, r => dbIsBlitz(r) ? 'BLITZ' : 'NO BLITZ');
  const groups = [
    dbRenderBarGroup('BLITZ vs NO BLITZ', blitzFreq, 2),
    dbRenderBarGroup('TOP FRONTS', dbFreq(rows, 'defFront'), 5),
    dbRenderBarGroup('TOP COVERAGES', dbFreq(rows, 'coverage'), 5),
    dbRenderEffectivenessBarGroup('MOST EFFECTIVE FRONTS (OFF SUCCESS% ALLOWED)', rows, dbDefFrontBucket, 5),
    dbRenderEffectivenessBarGroup('MOST EFFECTIVE COVERAGES (OFF SUCCESS% ALLOWED)', rows, dbCoverageBucket, 5)
  ].filter(Boolean);
  if (!groups.length) return '';
  return dbSectionWrap('TENDENCY OVERVIEW', `<div class="db-bar-grid">${groups.join('')}</div>`);
}

function dbRenderTopComboBanner(rows) {
  const groups = dbGroupBy(rows, dbComboKey);
  const entries = Object.entries(groups).sort((a, b) => b[1].length - a[1].length);
  if (!entries.length || entries[0][1].length < 3) return '';
  const [combo, rs] = entries[0];
  const pct = rows.length ? Math.round(rs.length / rows.length * 100) : 0;
  return `<div class="db-note" style="background:rgba(204,0,0,0.15);border-left-color:var(--red)">🎯 Most common defensive call: <strong>${dbEscapeHTML(combo)}</strong> — ${rs.length} snaps (${pct}% of all charted plays)</div>`;
}

const DB_TABS = [
  { id: 'calls', label: 'DEFENSIVE CALLS', render: rows => dbRenderComboTable(rows, 'MOST COMMON DEFENSIVE CALLS (FRONT + COVERAGE)') },
  { id: 'front', label: 'FRONT DETAIL', render: rows => dbRenderPairTable(rows, dbDefFrontBucket, 'FRONT', 'coverage', 'TOP COVERAGE', 'BY FRONT — WHAT THEY PLAY BEHIND IT') },
  { id: 'coverage', label: 'COVERAGE DETAIL', render: rows => dbRenderPairTable(rows, dbCoverageBucket, 'COVERAGE', 'defFront', 'TOP FRONT', 'BY COVERAGE — WHAT FRONT IT COMES FROM') },
  { id: 'blitz', label: 'BLITZ DETAIL', render: rows => dbRenderTopBlitzesByFront(rows, 5) },
  { id: 'downdist', label: 'DOWN & DISTANCE', render: rows => dbRenderGroupTable(rows, dbDownDistBucket, 'BY DOWN & DISTANCE') },
  { id: 'hash', label: 'HASH', render: rows => dbRenderGroupTable(rows, dbHashBucket, 'BY HASH') },
  { id: 'zone', label: 'FIELD ZONE', render: rows => dbRenderZoneTable(rows) },
  { id: 'formation', label: 'FORMATION', render: rows => dbRenderGroupTable(rows, dbFormPersonnelBucket, 'BY OFFENSIVE FORMATION & PERSONNEL FACED') },
  { id: 'personnel', label: 'PERSONNEL', render: rows => dbRenderGroupTable(rows, dbPersonnelBucket, 'BY OFFENSIVE PERSONNEL FACED') }
];

function dbRenderTabSection(rows) {
  if (!DB_TABS.some(t => t.id === dbActiveTab)) dbActiveTab = DB_TABS[0].id;
  const tabsHtml = DB_TABS.map(t => `<div class="db-tab${t.id === dbActiveTab ? ' active' : ''}" data-tab="${t.id}">${t.label}</div>`).join('');
  const active = DB_TABS.find(t => t.id === dbActiveTab);
  const bodyHtml = active.render(rows) || '<div class="db-empty">No data available for this breakdown.</div>';
  return `<div class="db-tabs">${tabsHtml}</div><div class="db-tab-panel">${bodyHtml}</div>`;
}

function renderDefDashboard(rows) {
  const dash = document.getElementById('db-dashboard');
  if (!rows || !rows.length) { dash.innerHTML = '<div class="db-empty">No data found in this file.</div>'; return; }
  let defRows = rows.filter(r => String(r.odk == null ? '' : r.odk).trim().toUpperCase().charAt(0) === 'D');
  let usedAll = false;
  if (!defRows.length) { defRows = rows; usedAll = true; }
  const overall = dbComputeOverall(defRows);
  const insights = dbGenerateInsights(defRows);
  dash.innerHTML = `
    ${usedAll ? '<div class="db-note">No ODK column marking defensive snaps was found — showing tendencies across all charted plays.</div>' : ''}
    ${dbRenderStats(overall)}
    ${dbRenderTopComboBanner(defRows)}
    ${dbRenderBarSection(defRows)}
    ${dbSectionWrap('KEY TENDENCIES', insights.length ? '<ul class="db-insights">' + insights.map(i => `<li>${i}</li>`).join('') + '</ul>' : '<div class="db-empty">Not enough data yet to detect strong tendencies. Upload more charted plays.</div>')}
    ${dbRenderTabSection(defRows)}
  `;
  dash.querySelectorAll('.db-section-title').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.secToggle;
      const sec = el.closest('.db-section');
      sec.classList.toggle('collapsed');
      if (sec.classList.contains('collapsed')) dbCollapsedSections.add(key); else dbCollapsedSections.delete(key);
    });
  });
  dash.querySelectorAll('.db-tab').forEach(el => {
    el.addEventListener('click', () => {
      dbActiveTab = el.dataset.tab;
      renderDefDashboard(rows);
    });
  });
}
